<svg xmlns="http://www.w3.org/2000/svg" width="100" height="180" viewBox="0 0 100 180">
  <title>悟空造型训练木桩</title>
  <desc>猴脸、棕帽金箍与黄色护衣，保留木纹、腹部靶心和固定底座。164像素以下为底座。</desc>
  <defs>
    <linearGradient id="wood" gradientUnits="userSpaceOnUse" x1="23" y1="0" x2="77" y2="0">
      <stop stop-color="#bb8146"/><stop offset=".45" stop-color="#edc18b"/><stop offset="1" stop-color="#b8773c"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f8c451"/><stop offset="1" stop-color="#d48627"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9c622a"/><stop offset="1" stop-color="#634022"/>
    </linearGradient>
  </defs>
  <g stroke="#472b1c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- 木制背棍与末端红漆，呼应悟空背上的金箍棒。 -->
    <path d="M8 111 85 66l4 7-77 45Z" fill="#c78d38"/>
    <path d="m8 111 11-6 4 7-11 6Zm69-40 8-5 4 7-8 5Z" fill="#ad4030"/>
    <!-- 脚底固定在180；柔性立柱与上身一起绕底座上缘摇摆。 -->
    <path d="M43 127h14v39H43Z" fill="url(#wood)"/>
    <path d="m48 137 1 23m5-20-2 13" stroke="#a06b37" stroke-width="1.5"/>
    <path d="m30 125-4 18 17 4 6-18Zm21 4 6 18 17-4-4-18Z" fill="#92582e"/>
    <path d="m27 139 17 3m12 0 16-3" stroke="#d29c56" stroke-width="2"/>
    <!-- 斜接木臂与黄色护衣。 -->
    <path d="M30 79 18 84 8 100l9 8 17-15Zm40 0 12 5 10 16-9 8-17-15Z" fill="url(#wood)"/>
    <path d="m16 93 9 7m50 0 9-7" stroke="#996130" stroke-width="1.5"/>
    <path d="M31 76 23 91l6 9-5 26q26 14 52 0l-5-26 6-9-8-15Z" fill="url(#robe)"/>
    <path d="m32 78 18 12 18-12-7-7H39Z" fill="#704226"/>
    <path d="m29 117-4 9q25 13 50 0l-4-9q-21 8-42 0Z" fill="#ac4130"/>
    <path d="m32 89-3 14m42-14 1 12" stroke="#fbe0a0" stroke-width="2"/>
    <!-- 腹部靶心嵌在木质护衣内，区分训练目标与角色本体。 -->
    <circle cx="50" cy="106" r="16" fill="#805130"/>
    <circle cx="50" cy="106" r="11.5" fill="#d97441" stroke="#eeb36c" stroke-width="1.5"/>
    <circle cx="50" cy="106" r="5" fill="#ffe1a0" stroke="none"/>
    <!-- 猴耳、雕刻脸颊与悟空的大头比例。 -->
    <circle cx="19" cy="49" r="9" fill="#a76e3b"/>
    <circle cx="81" cy="49" r="9" fill="#a76e3b"/>
    <path d="M19 45q-5 3 0 7m62-7q5 3 0 7" fill="none" stroke="#e3b37a" stroke-width="2"/>
    <path d="M23 31q27-17 54 0l4 21q-1 26-31 30-30-4-31-30Z" fill="#986035"/>
    <path d="M28 40q11-6 22 3 11-9 22-3l5 14q-2 21-27 25-25-4-27-25Z" fill="url(#wood)"/>
    <path d="m28 58 3 9m41-9-3 9" stroke="#ae723b" stroke-width="1.5"/>
    <g id="neutral-face" fill="none">
      <path d="m32 48 11 3m25-3-11 3" stroke-width="3.2"/>
      <path d="m35 55 7 1m23-1-7 1" stroke-width="3.5"/>
      <path d="m46 62 4 2 4-2" stroke="#a06a37" stroke-width="2"/>
      <path d="M41 70q9 5 18-1" stroke-width="2"/>
    </g>
    <!-- 棕色悟空帽与金色头箍，用刻线而非字体表达帽徽。 -->
    <path d="M18 29q-2-18 17-23 24-9 45 6l6 17-9 10-56-1Z" fill="url(#cap)"/>
    <path d="M24 15q16-9 34-4m9 3 9 5" fill="none" stroke="#b47d3b" stroke-width="2"/>
    <path d="m19 28 65-1 1 13-64 3Z" fill="#e9ad38"/>
    <path d="m23 30 55-1" stroke="#ffe18a" stroke-width="2"/>
    <path d="M33 32h-6v7h6m-3-4h7m0-4v9" fill="none" stroke="#9b591f" stroke-width="2"/>
    <path d="m80 39 7-5 6 5-11 7Z" fill="#bc4930"/>
    <!-- 固定底座与两个木榫，不参与受伤摇摆。 -->
    <path d="M35 165h30v7H35Z" fill="#8e5b32"/>
    <path d="M12 171h76v7H12Z" fill="#744728"/>
    <path d="M15 173h70" stroke="#b48145" stroke-width="1.5"/>
  </g>
</svg>
