<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1200" viewBox="0 0 1500 1200" role="img" aria-label="阶段 7 · 技能时间轴与多段攻击联合类图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">阶段 7 · 技能时间轴与多段攻击联合类图</text><text x="32" y="82" font-size="18" fill="#334155">定义资源只读；Core 意图 → GAS 激活 → 有序素材时间轴 → 每段命中 / 派生 / 取消。</text><a href="../definitions/battle_attack_segment.gd"><rect x="30" y="120" width="440" height="205" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 120H460Q470 120 470 130V166H30V130Q30 120 40 120" fill="#dcfce7"/><text x="46" y="150" font-size="21" fill="#0f172a">GAS 技能定义与资源</text><text x="46" y="196" font-size="17" fill="#334155">GameplayAbilityDefinition / Feature</text><text x="46" y="223" font-size="17" fill="#334155">AttackSegment：几何、倍率、反应</text><text x="46" y="250" font-size="17" fill="#334155">SkillBranch / SkillMotion / FrameEvent</text><text x="46" y="277" font-size="17" fill="#334155">BattleCatalog：深拷贝与引用校验</text></a><a href="../../gameplay_abiltiy_system/scripts/abilities/gameplay_ability_instance.gd"><rect x="530" y="120" width="440" height="205" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 120H960Q970 120 970 130V166H530V130Q530 120 540 120" fill="#fef3c7"/><text x="546" y="150" font-size="21" fill="#0f172a">GameplayAbilityInstance</text><text x="546" y="196" font-size="17" fill="#334155">学习、激活、独立黑板与完成</text><text x="546" y="223" font-size="17" fill="#334155">elapsed / pending / next_event</text><text x="546" y="250" font-size="17" fill="#334155">activation_serial：同步重入保护</text><text x="546" y="277" font-size="17" fill="#334155">CostFeature / VitalCost / Cooldown</text></a><a href="../gas/battle_frame_timeline_feature.gd"><rect x="1030" y="120" width="440" height="205" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 120H1460Q1470 120 1470 130V166H1030V130Q1030 120 1040 120" fill="#fef3c7"/><text x="1046" y="150" font-size="21" fill="#0f172a">BattleFrameTimelineFeature</text><text x="1046" y="196" font-size="17" fill="#334155">30 FPS 素材帧转换为战斗秒</text><text x="1046" y="223" font-size="17" fill="#334155">有序重放：事件 / 采样 / 关闭 / 派生</text><text x="1046" y="250" font-size="17" fill="#334155">推进至事件时刻，再查询命中</text><text x="1046" y="277" font-size="17" fill="#334155">跨完整技能仍先结算再完成</text></a><a href="../runtime/battle_action_leaf_state_2d.gd"><rect x="30" y="435" width="440" height="230" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 435H460Q470 435 470 445V481H30V445Q30 435 40 435" fill="#dbeafe"/><text x="46" y="465" font-size="21" fill="#0f172a">Core 操作与动作状态</text><text x="46" y="511" font-size="17" fill="#334155">按下 / 缓存 → 公共角色入口</text><text x="46" y="538" font-size="17" fill="#334155">分支按 operation，重映射不改技能</text><text x="46" y="565" font-size="17" fill="#334155">ATTACK 权限 / 霸体 / HURT / DEAD</text><text x="46" y="592" font-size="17" fill="#334155">动画完成只通知；死亡最高</text></a><a href="../runtime/battle_attack_instance.gd"><rect x="530" y="435" width="440" height="230" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 435H960Q970 435 970 445V481H530V445Q530 435 540 435" fill="#fce7f3"/><text x="546" y="465" font-size="21" fill="#0f172a">BattleAttackInstance</text><text x="546" y="511" font-size="17" fill="#334155">attack_id / ability_id / 起手朝向阵营</text><text x="546" y="538" font-size="17" fill="#334155">elapsed / phase / committed</text><text x="546" y="565" font-size="17" fill="#334155">windows[hit_index] / 操作缓存</text><text x="546" y="592" font-size="17" fill="#334155">hit_targets[段/目标]：count / next_time</text><text x="546" y="619" font-size="17" fill="#334155">owned_objects：按 cast_id 回收</text></a><a href="../runtime/battle_entity_2d.gd"><rect x="1030" y="435" width="440" height="230" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 435H1460Q1470 435 1470 445V481H1030V445Q1030 435 1040 435" fill="#fce7f3"/><text x="1046" y="465" font-size="21" fill="#0f172a">BattleEntity2D + 一个攻击框</text><text x="1046" y="511" font-size="17" fill="#334155">校验场次 / 实体 / 技能 / 释放编号</text><text x="1046" y="538" font-size="17" fill="#334155">每段配置同一个 CollisionShape2D</text><text x="1046" y="565" font-size="17" fill="#334155">素材矩形 → 比例 → 朝向 → 世界</text><text x="1046" y="592" font-size="17" fill="#334155">独立 Hurtbox / 敌对 / 存活 / 去重</text><text x="1046" y="619" font-size="17" fill="#334155">持续段：每目标间隔与最大次数</text></a><a href="../../gameplay_abiltiy_system/scripts/singletons/damage_calculator.gd"><rect x="30" y="795" width="440" height="205" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 795H460Q470 795 470 805V841H30V805Q30 795 40 795" fill="#fef3c7"/><text x="46" y="825" font-size="21" fill="#0f172a">GAS 伤害、Vital、Status / Effect</text><text x="46" y="871" font-size="17" fill="#334155">当前最终 atk / phyDef × 倍率 + 附伤</text><text x="46" y="898" font-size="17" fill="#334155">HealthVital → 实际扣血 → 反馈</text><text x="46" y="925" font-size="17" fill="#334155">成功命中后施加配置 Buff</text><text x="46" y="952" font-size="17" fill="#334155">保护上下文保留给后续完整结算</text></a><a href="../runtime/BattleMotionController2D.cs"><rect x="530" y="795" width="440" height="205" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 795H960Q970 795 970 805V841H530V805Q530 795 540 795" fill="#dbeafe"/><text x="546" y="825" font-size="21" fill="#0f172a">运动、反应与动画适配</text><text x="546" y="871" font-size="17" fill="#334155">技能位移逐区间扫掠，不提前执行</text><text x="546" y="898" font-size="17" fill="#334155">不同击退 / 浮空 / 硬直 → Core 许可</text><text x="546" y="925" font-size="17" fill="#334155">AnimationPlayer 按素材事件切动作</text><text x="546" y="952" font-size="17" fill="#334155">暂停 / 慢动作 / 停顿共用时钟</text></a><a href="../presentation/battle_timeline_object_2d.gd"><rect x="1030" y="795" width="440" height="205" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 795H1460Q1470 795 1470 805V841H1030V805Q1030 795 1040 795" fill="#dcfce7"/><text x="1046" y="825" font-size="21" fill="#0f172a">预置时间轴对象与清理</text><text x="1046" y="871" font-size="17" fill="#334155">FrameEvent → battle.skill.object</text><text x="1046" y="898" font-size="17" fill="#334155">承载 effect / projectile / summon</text><text x="1046" y="925" font-size="17" fill="#334155">生成偏移、速度、生命周期、播放器</text><text x="1046" y="952" font-size="17" fill="#334155">关闭窗口 / pending / 缓存 / 对象</text></a><path d="M470 222H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="207" font-size="15" fill="#334155">实例</text><path d="M970 222H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="982" y="207" font-size="15" fill="#334155">驱动</text><path d="M250 325V380H750V435" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="365" y="370" font-size="15" fill="#334155">定义只读</text><path d="M470 548H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="533" font-size="15" fill="#334155">意图</text><path d="M970 548H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="982" y="533" font-size="15" fill="#334155">判定</text><path d="M1250 325V435" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1264" y="393" font-size="15" fill="#334155">重放</text><path d="M1130 665V724H250V795" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="470" y="714" font-size="15" fill="#334155">倍率 / 子技能 / Buff / 反应</text><path d="M470 895H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="880" font-size="15" fill="#334155">受击</text><path d="M1250 665V795" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1266" y="752" font-size="15" fill="#334155">事件</text><text x="32" y="1080" font-size="18" fill="#334155">测试：4 / 12 / 20 帧三段 → 10.5 / 24 / 36.5 伤害 → 不同击退，末段浮空 → 28—38 帧派生 → 40 帧结束。</text><text x="32" y="1116" font-size="18" fill="#334155">持续命中按释放 / 段 / 目标隔离；取消立即阻止未来事件与位移；旧回调不能回收新释放复用的对象。</text><text x="32" y="1152" font-size="18" fill="#334155">对象是时间轴承载接口；原版保护公式、2D 弹道碰撞 / 穿透与召唤 AI 由后续模块接入。</text></svg>
