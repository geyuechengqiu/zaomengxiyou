<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1090" viewBox="0 0 1500 1090" role="img" aria-label="悟空转职前四技能与火魔斩 · 类图和联合执行"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">悟空转职前四技能与火魔斩 · 类图和联合执行</text><text x="32" y="82" font-size="18" fill="#334155">配置只读，施放实例独占技能等级、瞄准、时钟与命中记录；所有身体、特效及唯一攻击框预置在场景。</text><a href="../input/battle_player_operations.gd"><rect x="30" y="120" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 120H460Q470 120 470 130V166H30V130Q30 120 40 120" fill="#e2e8f0"/><text x="46" y="150" font-size="21" fill="#0f172a">Core Operation → ActionState</text><text x="46" y="196" font-size="17" fill="#334155">Y / U / I / O / L → 技能槽意图</text><text x="46" y="223" font-size="17" fill="#334155">当前状态检查地面 / 空中 / 控制</text><text x="46" y="250" font-size="17" fill="#334155">重复 O → 风暴重劈派生</text><text x="46" y="277" font-size="17" fill="#334155">W / S → 射线瞄准轴</text></a><a href="../../../data/skills/sunwukong/README.md"><rect x="530" y="120" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 120H960Q970 120 970 130V166H530V130Q530 120 540 120" fill="#dcfce7"/><text x="546" y="150" font-size="21" fill="#0f172a">GameplayAbilityDefinition</text><text x="546" y="196" font-size="17" fill="#334155">原版 MP / CD 逐级表</text><text x="546" y="223" font-size="17" fill="#334155">FrameTimeline：30 FPS 原帧号</text><text x="546" y="250" font-size="17" fill="#334155">AttackSegment：AB / 次数 / 间隔</text><text x="546" y="277" font-size="17" fill="#334155">状态、位移、派生与空中许可</text></a><a href="../gas/battle_skill_mana_cost.gd"><rect x="1030" y="120" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 120H1460Q1470 120 1470 130V166H1030V130Q1030 120 1040 120" fill="#dbeafe"/><text x="1046" y="150" font-size="21" fill="#0f172a">GAS AbilityInstance / Status</text><text x="1046" y="196" font-size="17" fill="#334155">本次技能等级快照 → MP / CD</text><text x="1046" y="223" font-size="17" fill="#334155">黑板保存剩余冷却和运行状态</text><text x="1046" y="250" font-size="17" fill="#334155">原版霸体与 dmgRate 来源撤销</text><text x="1046" y="277" font-size="17" fill="#334155">取消不退已支付MP和已提交CD</text></a><a href="../runtime/battle_attack_instance.gd"><rect x="30" y="440" width="440" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 440H460Q470 440 470 450V486H30V450Q30 440 40 440" fill="#dbeafe"/><text x="46" y="470" font-size="21" fill="#0f172a">BattleAttackInstance</text><text x="46" y="516" font-size="17" fill="#334155">释放 / 攻击段 / 目标 → 命中记录</text><text x="46" y="543" font-size="17" fill="#334155">素材帧接触采样 + 精确再次命中</text><text x="46" y="570" font-size="17" fill="#334155">0.18秒不舍入至整数素材帧</text><text x="46" y="597" font-size="17" fill="#334155">取消清空窗口、待执行事件</text><text x="46" y="624" font-size="17" fill="#334155">多个同配置悟空完全隔离</text></a><a href="../gas/battle_frame_timeline_feature.gd"><rect x="530" y="440" width="440" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 440H960Q970 440 970 450V486H530V450Q530 440 540 440" fill="#fef3c7"/><text x="546" y="470" font-size="21" fill="#0f172a">BattleFrameTimelineFeature</text><text x="546" y="516" font-size="17" fill="#334155">跨帧按时间顺序补发</text><text x="546" y="543" font-size="17" fill="#334155">烈焰闪扫掠 / 墙体，速度800</text><text x="546" y="570" font-size="17" fill="#334155">火眼金睛60度/秒，-30～15度</text><text x="546" y="597" font-size="17" fill="#334155">风暴：旋转5次 → 重劈1次</text><text x="546" y="624" font-size="17" fill="#334155">火魔斩：连打5次 → 独立砸地</text></a><a href="../animation/spine_animation_adapter.gd"><rect x="1030" y="440" width="440" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 440H1460Q1470 440 1470 450V486H1030V450Q1030 440 1040 440" fill="#fef3c7"/><text x="1046" y="470" font-size="21" fill="#0f172a">SpineAnimationAdapter</text><text x="1046" y="516" font-size="17" fill="#334155">主 AnimationPlayer → 原生子轨道</text><text x="1046" y="543" font-size="17" fill="#334155">SkillPrimary / Secondary / BeamEnd</text><text x="1046" y="570" font-size="17" fill="#334155">身体、射线、头部、端点同步</text><text x="1046" y="597" font-size="17" fill="#334155">火魔斩：43帧恢复，46帧消散</text><text x="1046" y="624" font-size="17" fill="#334155">尾帧仅表现，取消统一清理</text></a><a href="../movement/battle_hitbox_2d.gd"><rect x="30" y="790" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 790H460Q470 790 470 800V836H30V800Q30 790 40 790" fill="#dbeafe"/><text x="46" y="820" font-size="21" fill="#0f172a">唯一 AttackHitbox → Hurtbox</text><text x="46" y="866" font-size="17" fill="#334155">AB坐标 / 偏移 / 素材比例2</text><text x="46" y="893" font-size="17" fill="#334155">射线旋转，整体随朝向镜像</text><text x="46" y="920" font-size="17" fill="#334155">无效或零面积AB不命中</text><text x="46" y="947" font-size="17" fill="#334155">物理碰撞与攻击/受击区域分开</text></a><a href="../combat/battle_original_damage_strategy.gd"><rect x="530" y="790" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 790H960Q970 790 970 800V836H530V800Q530 790 540 790" fill="#dbeafe"/><text x="546" y="820" font-size="21" fill="#0f172a">OriginalDamage → GAS Vital</text><text x="546" y="866" font-size="17" fill="#334155">语义 ID → 原技能倍率与固定附伤</text><text x="546" y="893" font-size="17" fill="#334155">火魔斩砸地独立1101081</text><text x="546" y="920" font-size="17" fill="#334155">原版暴击、抗性、减伤与护盾</text><text x="546" y="947" font-size="17" fill="#334155">计算伤害 / 实际HP变化分别保存</text></a><a href="../runtime/battle_session.gd"><rect x="1030" y="790" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 790H1460Q1470 790 1470 800V836H1030V800Q1030 790 1040 790" fill="#e2e8f0"/><text x="1046" y="820" font-size="21" fill="#0f172a">BattleClock / Presentation</text><text x="1046" y="866" font-size="17" fill="#334155">统一暂停、慢动作与受击停顿</text><text x="1046" y="893" font-size="17" fill="#334155">MP/CD/动画/Buff只用战斗delta</text><text x="1046" y="920" font-size="17" fill="#334155">Core发布命中、结算及状态通知</text><text x="1046" y="947" font-size="17" fill="#334155">全场共用跳字池与怪物血条</text></a><path d="M470 225H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="475" y="210" font-size="15" fill="#334155">槽位</text><path d="M970 225H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="974" y="210" font-size="15" fill="#334155">独占实例</text><path d="M750 330V440" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="385" font-size="15" fill="#334155">只读时间轴</text><path d="M1250 330V380H915V440" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1000" y="370" font-size="15" fill="#334155">开始 / MP / CD / 状态</text><path d="M530 555H470" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="542" font-size="15" fill="#334155">记录</text><path d="M970 555H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="980" y="542" font-size="15" fill="#334155">动作</text><path d="M250 675V790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="735" font-size="15" fill="#334155">窗口与去重</text><path d="M470 895H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="475" y="875" font-size="15" fill="#334155">敌对目标</text><path d="M970 895H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="980" y="875" font-size="15" fill="#334155">反馈</text><path d="M1250 790V730H750V675" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="995" y="717" font-size="15" fill="#334155">统一战斗时钟</text><text x="32" y="1050" font-size="17" fill="#334155">火魔斩：0～28帧连打（最多5次，每次间隔0.18秒） → 28～43帧砸地（1次） → 43～46帧视觉尾部（0伤害）。</text></svg>
