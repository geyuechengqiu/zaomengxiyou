<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-label="阶段四 · 运动控制器、动作状态与插件联合类图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">阶段四 · 运动控制器、动作状态与插件联合类图</text><text x="32" y="80" font-size="18" fill="#334155">输入、支撑接触与技能许可决定动作状态；动画完成只通知，死亡由 GAS Vital 耗尽触发。</text><a href="../runtime/battle_session.gd"><rect x="30" y="120" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 120H460Q470 120 470 130V166H30V130Q30 120 40 120" fill="#fef3c7"/><text x="46" y="150" font-size="21" fill="#0f172a">BattleSession / BattleClock</text><text x="46" y="196" font-size="17" fill="#334155">固定物理 tick → combat delta</text><text x="46" y="223" font-size="17" fill="#334155">移动 / 技能 / 状态 / 动画同步缩放</text><text x="46" y="250" font-size="17" fill="#334155">暂停和停顿保持状态时间</text><text x="46" y="277" font-size="17" fill="#334155">Core：场次与实体事件</text></a><a href="../definitions/battle_action_profile_2d.gd"><rect x="530" y="120" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 120H960Q970 120 970 130V166H530V130Q530 120 540 120" fill="#dcfce7"/><text x="546" y="150" font-size="21" fill="#0f172a">BattleActionProfile2D : Resource</text><text x="546" y="196" font-size="17" fill="#334155">重力 / 跳跃 / 二跳 / 落地窗口</text><text x="546" y="223" font-size="17" fill="#334155">state_rules：移动、跳跃、转向</text><text x="546" y="250" font-size="17" fill="#334155">每种攻击允许类型与打断门槛</text><text x="546" y="277" font-size="17" fill="#334155">共享只读，引用连击定义</text></a><a href="../input/battle_player_operations.gd"><rect x="1030" y="120" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 120H1460Q1470 120 1470 130V166H1030V130Q1030 120 1040 120" fill="#e2e8f0"/><text x="1046" y="150" font-size="21" fill="#0f172a">Core / BattlePlayerOperations</text><text x="1046" y="196" font-size="17" fill="#334155">按下 / HELD / 松开 / 长按</text><text x="1046" y="223" font-size="17" fill="#334155">行走与奔跑 → GAS 速度属性</text><text x="1046" y="250" font-size="17" fill="#334155">request_attack：发动或预约</text><text x="1046" y="277" font-size="17" fill="#334155">撤回控制同时撤回预约</text></a><a href="../runtime/BattleMotionController2D.cs"><rect x="30" y="435" width="440" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 435H460Q470 435 470 445V481H30V445Q30 435 40 435" fill="#dbeafe"/><text x="46" y="465" font-size="21" fill="#0f172a">BattleMotionController2D</text><text x="46" y="511" font-size="17" fill="#334155">body: CharacterBody2D / velocity</text><text x="46" y="538" font-size="17" fill="#334155">move_and_collide + 法线滑移</text><text x="46" y="565" font-size="17" fill="#334155">grounded / wall / ceiling / landed</text><text x="46" y="592" font-size="17" fill="#334155">单向平台 / 边缘 / 最大 1/60 子步</text><text x="46" y="619" font-size="17" fill="#334155">跳跃预算：地面一次，空中一次</text></a><a href="../runtime/battle_entity_2d.gd"><rect x="530" y="435" width="440" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 435H960Q970 435 970 445V481H530V445Q530 435 540 435" fill="#dbeafe"/><text x="546" y="465" font-size="21" fill="#0f172a">BattleEntity2D : CharacterBody2D</text><text x="546" y="511" font-size="17" fill="#334155">独立持有 motion / state / combo</text><text x="546" y="538" font-size="17" fill="#334155">许可 → 速度与朝向 → 扫掠碰撞</text><text x="546" y="565" font-size="17" fill="#334155">原生 Spine → GAS → 状态 / 连击</text><text x="546" y="592" font-size="17" fill="#334155">技能位移仍经过墙体碰撞</text><text x="546" y="619" font-size="17" fill="#334155">伤害 → 打断判断 → HURT / DEAD</text></a><a href="../runtime/battle_action_state_machine_2d.gd"><rect x="1030" y="435" width="440" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 435H1460Q1470 435 1470 445V481H1030V445Q1030 435 1040 435" fill="#fce7f3"/><text x="1046" y="465" font-size="21" fill="#0f172a">Core 动作机 / 状态入口</text><text x="1046" y="511" font-size="17" fill="#334155">BaseStateMachine + 9 个 BaseState</text><text x="1046" y="538" font-size="17" fill="#334155">BattleActionState2D 委托当前叶子</text><text x="1046" y="565" font-size="17" fill="#334155">叶子 elapsed / active_rules 覆盖</text><text x="1046" y="592" font-size="17" fill="#334155">霸体 + 类型 + 优先级决定打断</text><text x="1046" y="619" font-size="17" fill="#334155">DEAD 终态，Core 跳转也受守卫</text></a><a href="../../gameplay_abiltiy_system/scripts/components/gameplay_vital_attribute_component.gd"><rect x="30" y="785" width="440" height="200" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 785H460Q470 785 470 795V831H30V795Q30 785 40 785" fill="#fee2e2"/><text x="46" y="815" font-size="21" fill="#0f172a">GAS Attributes / Vital / Tags</text><text x="46" y="861" font-size="17" fill="#334155">walkSpeed / runSpeed：实时读数</text><text x="46" y="888" font-size="17" fill="#334155">HealthVital：实际扣血及死亡</text><text x="46" y="915" font-size="17" fill="#334155">state.super_armor：抵挡普通硬直</text><text x="46" y="942" font-size="17" fill="#334155">重攻击仍需满足技能门槛</text></a><a href="../runtime/battle_combo_state.gd"><rect x="530" y="785" width="440" height="200" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 785H960Q970 785 970 795V831H530V795Q530 785 540 785" fill="#dcfce7"/><text x="546" y="815" font-size="21" fill="#0f172a">BattleComboState / GAS Ability</text><text x="546" y="861" font-size="17" fill="#334155">按段配置覆盖状态许可</text><text x="546" y="888" font-size="17" fill="#334155">地面跳取消：终止技能和预约</text><text x="546" y="915" font-size="17" fill="#334155">离开地面结束地面普攻</text><text x="546" y="942" font-size="17" fill="#334155">帧事件由技能实例时间线驱动</text></a><a href="../animation/character_animation_adapter.gd"><rect x="1030" y="785" width="440" height="200" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 785H1460Q1470 785 1470 795V831H1030V795Q1030 785 1040 785" fill="#fef3c7"/><text x="1046" y="815" font-size="21" fill="#0f172a">CharacterAnimationAdapter</text><text x="1046" y="861" font-size="17" fill="#334155">动作名称 / 朝向 / 皮肤 / 进度</text><text x="1046" y="888" font-size="17" fill="#334155">jump_2 → 原生 jumpTwo</text><text x="1046" y="915" font-size="17" fill="#334155">LAND → idle，无独立落地素材</text><text x="1046" y="942" font-size="17" fill="#334155">完成通知不决定支撑或死亡</text></a><path d="M250 330V375H650V435" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="332" y="366" font-size="15" fill="#334155">调度</text><path d="M750 330V435" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="389" font-size="15" fill="#334155">只读规则</text><path d="M1250 330V375H850V435" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="992" y="365" font-size="15" fill="#334155">操作命令</text><path d="M530 525H470" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="479" y="514" font-size="15" fill="#334155">速度</text><path d="M470 592H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="479" y="580" font-size="15" fill="#334155">支撑</text><path d="M1030 545H970" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="534" font-size="15" fill="#334155">权限</text><path d="M250 785V725H640V670" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="293" y="715" font-size="15" fill="#334155">伤害 / 速度</text><path d="M750 785V670" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="727" font-size="15" fill="#334155">技能规则</text><path d="M860 670V725H1250V785" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="995" y="715" font-size="15" fill="#334155">动作命令</text><text x="32" y="1040" font-size="18" fill="#334155">转换条件：地面 + 方向 → MOVE/RUN；起跳 → TAKEOFF → AIR；实际支撑 → LAND；Vital=0 → DEAD。</text><text x="32" y="1080" font-size="18" fill="#334155">ATTACK 由 GAS 完成/取消退出；HURT 由硬直窗口退出。每个实例独立计时、独立预算、独立预约。</text></svg>
