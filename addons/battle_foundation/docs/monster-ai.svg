<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1110" viewBox="0 0 1520 1110" role="img" aria-label="普通怪物与AI · 类图及联合执行"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">普通怪物与AI · 类图及联合执行</text><text x="32" y="80" font-size="18" fill="#334155">资源只保存行为定义；AI提交意图，Core动作规则与GAS执行，公共表现属于BattleSession。</text><a href="../ai/battle_ai_profile_2d.gd"><rect x="30" y="120" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 120H480Q490 120 490 130V166H30V130Q30 120 40 120" fill="#dcfce7"/><text x="46" y="150" font-size="21" fill="#0f172a">BattleAIProfile2D</text><text x="46" y="196" font-size="17" fill="#334155">Policy / TargetSelector / Skill ID</text><text x="46" y="223" font-size="17" fill="#334155">索敌、活动、巡逻与攻击距离</text><text x="46" y="250" font-size="17" fill="#334155">退步、跳障、低血逃离配置</text><text x="46" y="277" font-size="17" fill="#334155">不保存当前目标或冷却</text></a><a href="../ai/battle_ai_policy_2d.gd"><rect x="530" y="120" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 120H980Q990 120 990 130V166H530V130Q530 120 540 120" fill="#dcfce7"/><text x="546" y="150" font-size="21" fill="#0f172a">BattleAIPolicy2D</text><text x="546" y="196" font-size="17" fill="#334155">decide(controller) → 意图Dictionary</text><text x="546" y="223" font-size="17" fill="#334155">Basic：melee / ranged / stationary</text><text x="546" y="250" font-size="17" fill="#334155">CHASE / RETURN / PATROL / FLEE</text><text x="546" y="277" font-size="17" fill="#334155">自定义资源覆盖决策函数</text></a><a href="../ai/battle_ai_target_selector_2d.gd"><rect x="1030" y="120" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 120H1480Q1490 120 1490 130V166H1030V130Q1030 120 1040 120" fill="#dcfce7"/><text x="1046" y="150" font-size="21" fill="#0f172a">BattleAITargetSelector2D</text><text x="1046" y="196" font-size="17" fill="#334155">过滤敌对、存活、检测/活动边界</text><text x="1046" y="223" font-size="17" fill="#334155">最近 / 最低HP / 最高攻击</text><text x="1046" y="250" font-size="17" fill="#334155">可优先指定实体定义</text><text x="1046" y="277" font-size="17" fill="#334155">新规则覆盖score_target</text></a><a href="../ai/battle_ai_controller_2d.gd"><rect x="30" y="430" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 430H480Q490 430 490 440V476H30V440Q30 430 40 430" fill="#dbeafe"/><text x="46" y="460" font-size="21" fill="#0f172a">BattleAIController2D : Node</text><text x="46" y="506" font-size="17" fill="#334155">场景预置，独占目标/出生点</text><text x="46" y="533" font-size="17" fill="#334155">独占退步、巡逻、决策计时</text><text x="46" y="560" font-size="17" fill="#334155">只接受战斗delta，受控时停请求</text><text x="46" y="587" font-size="17" fill="#334155">AI与玩家共享动作入口</text></a><a href="../runtime/battle_action_leaf_state_2d.gd"><rect x="530" y="430" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 430H980Q990 430 990 440V476H530V440Q530 430 540 430" fill="#fef3c7"/><text x="546" y="460" font-size="21" fill="#0f172a">CoreOperationIntent → Core状态机</text><text x="546" y="506" font-size="17" fill="#334155">origin=ai；move / jump / ai_skill</text><text x="546" y="533" font-size="17" fill="#334155">当前叶子检查移动/转向/攻击许可</text><text x="546" y="560" font-size="17" fill="#334155">STUN / HURT / DEAD 不绕过</text><text x="546" y="587" font-size="17" fill="#334155">request_skill_operation → GAS</text></a><a href="../gas/battle_frame_timeline_feature.gd"><rect x="1030" y="430" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 430H1480Q1490 430 1490 440V476H1030V440Q1030 430 1040 430" fill="#dbeafe"/><text x="1046" y="460" font-size="21" fill="#0f172a">GAS Ability / Cooldown / Cast</text><text x="1046" y="506" font-size="17" fill="#334155">每怪物独占AbilityInstance与黑板</text><text x="1046" y="533" font-size="17" fill="#334155">按原素材30FPS重放命中窗口</text><text x="1046" y="560" font-size="17" fill="#334155">AttackInstance按释放/段/目标去重</text><text x="1046" y="587" font-size="17" fill="#334155">取消和死亡清除窗口及待执行事件</text></a><a href="../runtime/battle_entity_2d.gd"><rect x="30" y="770" width="460" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 770H480Q490 770 490 780V816H30V780Q30 770 40 770" fill="#dbeafe"/><text x="46" y="800" font-size="21" fill="#0f172a">BattleEntity2D · 共享角色组件</text><text x="46" y="846" font-size="17" fill="#334155">Motion：重力 / 墙 / 地面 / 跳跃</text><text x="46" y="873" font-size="17" fill="#334155">Attribute / Vital：基础和当前HP</text><text x="46" y="900" font-size="17" fill="#334155">Status：眩晕、减速、护盾、霸体</text><text x="46" y="927" font-size="17" fill="#334155">Reaction / Protection / Death</text><text x="46" y="954" font-size="17" fill="#334155">无需第二套怪物移动或扣血代码</text></a><a href="../movement/battle_hitbox_2d.gd"><rect x="530" y="770" width="460" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 770H980Q990 770 990 780V816H530V780Q530 770 540 770" fill="#fef3c7"/><text x="546" y="800" font-size="21" fill="#0f172a">动画、判定与原版伤害</text><text x="546" y="846" font-size="17" fill="#334155">AnimationPlayerAdapter2D + 原图集</text><text x="546" y="873" font-size="17" fill="#334155">角色物理体 / Hurtbox / 单一Hitbox</text><text x="546" y="900" font-size="17" fill="#334155">同一攻击段可逐帧读取hit_rect_frames</text><text x="546" y="927" font-size="17" fill="#334155">原版DamageStrategy → HealthVital</text><text x="546" y="954" font-size="17" fill="#334155">命中/结算事件接入Buff被动</text></a><a href="../runtime/battle_session.gd"><rect x="1030" y="770" width="460" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 770H1480Q1490 770 1490 780V816H1030V780Q1030 770 1040 770" fill="#e2e8f0"/><text x="1046" y="800" font-size="21" fill="#0f172a">BattleSession + 预置关卡</text><text x="1046" y="846" font-size="17" fill="#334155">Clock：暂停 / 慢动作 / 受击停顿</text><text x="1046" y="873" font-size="17" fill="#334155">Core EventBus + 命名ai随机流</text><text x="1046" y="900" font-size="17" fill="#334155">预置32只碧玉径普通小怪</text><text x="1046" y="927" font-size="17" fill="#334155">共享Presentation：血条/跳字/受击</text><text x="1046" y="954" font-size="17" fill="#334155">关卡退出统一注销和清理实例</text></a><path d="M260 330V430" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="275" y="383" font-size="15" fill="#334155">配置</text><path d="M750 330V365H400V430" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="358" font-size="15" fill="#334155">调用Policy</text><path d="M1260 330V395H435V430" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="910" y="387" font-size="15" fill="#334155">选择目标</text><path d="M490 535H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="491" y="521" font-size="15" fill="#334155">意图</text><path d="M990 535H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="998" y="521" font-size="15" fill="#334155">GAS</text><path d="M260 640V770" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="275" y="713" font-size="15" fill="#334155">操作同一角色</text><path d="M1260 640V680H750V770" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="797" y="673" font-size="15" fill="#334155">素材帧 → 几何/结算</text><path d="M490 880H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="491" y="857" font-size="15" fill="#334155">属性</text><path d="M990 880H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="991" y="857" font-size="15" fill="#334155">事件</text><path d="M1260 770V700H10V535H30" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1080" y="725" font-size="15" fill="#334155">统一战斗tick</text><text x="32" y="1070" font-size="18" fill="#334155">原版：剑舞32帧/两个窗口；驭兽使53帧/36～39帧兽形判定；共享配置不保存生命与技能冷却。</text></svg>
