<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140" role="img" aria-label="孙悟空 · Core 状态机接入、继承与生命周期类图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">孙悟空 · Core 状态机接入、继承与生命周期类图</text><text x="32" y="80" font-size="18" fill="#334155">状态与时间以 Core 当前叶子为准：注册供查询，唯一战斗时钟驱动，销毁显式注销并断开所属关系。</text><a href="../../godot_core_system-0.0.4/source/state_machine/state_machine_manager.gd"><rect x="30" y="120" width="440" height="220" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 120H460Q470 120 470 130V166H30V130Q30 120 40 120" fill="#e2e8f0"/><text x="46" y="150" font-size="21" fill="#0f172a">Core StateMachineManager</text><text x="46" y="196" font-size="17" fill="#334155">注册 ID：场次 + 实体运行 ID</text><text x="46" y="223" font-size="17" fill="#334155">update / physics / input = false</text><text x="46" y="250" font-size="17" fill="#334155">get_state_machine / get_current_state</text><text x="46" y="277" font-size="17" fill="#334155">unregister → stop → dispose</text><text x="46" y="304" font-size="17" fill="#334155">被拒绝的启动不发 started</text></a><a href="../runtime/battle_action_state_machine_2d.gd"><rect x="530" y="120" width="440" height="220" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 120H960Q970 120 970 130V166H530V130Q530 120 540 120" fill="#fce7f3"/><text x="546" y="150" font-size="21" fill="#0f172a">BattleActionStateMachine2D</text><text x="546" y="196" font-size="17" fill="#334155">extends BaseStateMachine / 9 叶子</text><text x="546" y="223" font-size="17" fill="#334155">move_axis / running：语义运行数据</text><text x="546" y="250" font-size="17" fill="#334155">handle_operation → 当前叶子</text><text x="546" y="277" font-size="17" fill="#334155">transition_local：死亡终态守卫</text><text x="546" y="304" font-size="17" fill="#334155">dispose：清叶子、agent 与变量</text></a><a href="../../godot_core_system-0.0.4/source/state_machine/base_state_machine.gd"><rect x="1030" y="120" width="440" height="220" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 120H1460Q1470 120 1470 130V166H1030V130Q1030 120 1040 120" fill="#e2e8f0"/><text x="1046" y="150" font-size="21" fill="#0f172a">Core BaseStateMachine</text><text x="1046" y="196" font-size="17" fill="#334155">current_state / previous_state / states</text><text x="1046" y="223" font-size="17" fill="#334155">start / stop / transition_local</text><text x="1046" y="250" font-size="17" fill="#334155">physics_update → 当前叶子</text><text x="1046" y="277" font-size="17" fill="#334155">state_changed(from, to)</text><text x="1046" y="304" font-size="17" fill="#334155">Core 负责退出、进入与历史</text></a><a href="../runtime/battle_action_state_2d.gd"><rect x="30" y="460" width="440" height="220" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 460H460Q470 460 470 470V506H30V470Q30 460 40 460" fill="#dbeafe"/><text x="46" y="490" font-size="21" fill="#0f172a">BattleActionState2D</text><text x="46" y="536" font-size="17" fill="#334155">语义兼容入口，不另存状态/计时</text><text x="46" y="563" font-size="17" fill="#334155">current / elapsed → Core 当前叶子</text><text x="46" y="590" font-size="17" fill="#334155">enter(kind, rules) → Core 跳转</text><text x="46" y="617" font-size="17" fill="#334155">advance → machine.physics_update</text><text x="46" y="644" font-size="17" fill="#334155">bind / dispose：注册生命周期</text></a><a href="../runtime/battle_action_leaf_state_2d.gd"><rect x="530" y="460" width="440" height="220" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 460H960Q970 460 970 470V506H530V470Q530 460 540 460" fill="#fce7f3"/><text x="546" y="490" font-size="21" fill="#0f172a">BattleActionLeafState2D</text><text x="546" y="536" font-size="17" fill="#334155">extends BaseState / kind / elapsed</text><text x="546" y="563" font-size="17" fill="#334155">handle_operation：四阶段意图</text><text x="546" y="590" font-size="17" fill="#334155">按下发动 / 松开清方向 → IDLE</text><text x="546" y="617" font-size="17" fill="#334155">进入复制规则 / 退出清覆盖</text><text x="546" y="644" font-size="17" fill="#334155">物理条件表与移动/跳跃/打断许可</text></a><a href="../../godot_core_system-0.0.4/source/state_machine/base_state.gd"><rect x="1030" y="460" width="440" height="220" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 460H1460Q1470 460 1470 470V506H1030V470Q1030 460 1040 460" fill="#e2e8f0"/><text x="1046" y="490" font-size="21" fill="#0f172a">Core BaseState</text><text x="1046" y="536" font-size="17" fill="#334155">state_machine / agent / is_active</text><text x="1046" y="563" font-size="17" fill="#334155">enter → _enter → state_entered</text><text x="1046" y="590" font-size="17" fill="#334155">exit → _exit → state_exited</text><text x="1046" y="617" font-size="17" fill="#334155">physics_update → _physics_update</text><text x="1046" y="644" font-size="17" fill="#334155">叶子 transition_to → 所属机器</text></a><a href="../input/battle_player_operations.gd"><rect x="30" y="805" width="440" height="200" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 805H460Q470 805 470 815V851H30V815Q30 805 40 805" fill="#fef3c7"/><text x="46" y="835" font-size="21" fill="#0f172a">时钟 / 操作意图</text><text x="46" y="881" font-size="17" fill="#334155">战斗时钟统一推进运动与 GAS</text><text x="46" y="908" font-size="17" fill="#334155">Core 控制器 → 适配 → 当前叶子</text><text x="46" y="935" font-size="17" fill="#334155">按聚合轴判断移动，释放回待机</text><text x="46" y="962" font-size="17" fill="#334155">撤回控制同步清方向及预约</text></a><a href="../runtime/battle_entity_2d.gd"><rect x="530" y="805" width="440" height="200" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 805H960Q970 805 970 815V851H530V815Q530 805 540 805" fill="#dbeafe"/><text x="546" y="835" font-size="21" fill="#0f172a">BattleEntity2D</text><text x="546" y="881" font-size="17" fill="#334155">每个实体拥有独立动作机</text><text x="546" y="908" font-size="17" fill="#334155">Core 状态改变 → 战斗事件通知</text><text x="546" y="935" font-size="17" fill="#334155">重生 / 离树 → 注销动作机</text><text x="546" y="962" font-size="17" fill="#334155">RefCounted 叶子所属引用断开</text></a><a href="../animation/character_animation_adapter.gd"><rect x="1030" y="805" width="440" height="200" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 805H1460Q1470 805 1470 815V851H1030V815Q1030 805 1040 805" fill="#dcfce7"/><text x="1046" y="835" font-size="21" fill="#0f172a">GAS 技能 / 独立动画适配</text><text x="1046" y="881" font-size="17" fill="#334155">连击每段重入 Core ATTACK</text><text x="1046" y="908" font-size="17" fill="#334155">GAS 时长结束才推进下一段</text><text x="1046" y="935" font-size="17" fill="#334155">伤害与霸体 → HURT / DEAD</text><text x="1046" y="962" font-size="17" fill="#334155">动画完成只通知，不授予许可</text></a><path d="M470 225H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="479" y="213" font-size="15" fill="#334155">登记</text><path d="M970 225H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="213" font-size="15" fill="#334155">继承</text><path d="M250 460V400H650V340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="375" y="390" font-size="15" fill="#334155">持有</text><path d="M750 340V460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="405" font-size="15" fill="#334155">持有叶子</text><path d="M970 565H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="553" font-size="15" fill="#334155">继承</text><path d="M250 805V680" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="266" y="746" font-size="15" fill="#334155">推进</text><path d="M750 805V735H250V680" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="376" y="725" font-size="15" fill="#334155">命令 / 清理</text><path d="M1250 805V735H850V680" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="985" y="725" font-size="15" fill="#334155">GAS 规则</text><text x="32" y="1060" font-size="18" fill="#334155">Core 名称：IDLE / MOVE / RUN / TAKEOFF / AIR / LAND / ATTACK / HURT / DEAD；旧枚举 JUMP 对应 AIR。</text><text x="32" y="1100" font-size="18" fill="#334155">死亡守卫涵盖：语义入口、Core 管理器、叶子跳转及 stop/start；重生创建新机器和新叶子。</text></svg>
