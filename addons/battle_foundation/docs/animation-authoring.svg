<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-label="孙悟空 · 可视化动画与攻击判定框"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">孙悟空 · 可视化动画与攻击判定框</text><text x="32" y="80" font-size="18" fill="#334155">所有技能复用一个场景判定框；编辑器与战斗均读取技能数据，许可继续由 Core/GAS 决定。</text><a href="../../../data/animation/sunwukong_visual.tscn"><rect x="30" y="115" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 115H460Q470 115 470 125V161H30V125Q30 115 40 115" fill="#dcfce7"/><text x="46" y="145" font-size="21" fill="#0f172a">sunwukong_visual.tscn</text><text x="46" y="191" font-size="17" fill="#334155">静态 SpineSprite / 原生轨道 / 两个播放器</text><text x="46" y="218" font-size="17" fill="#334155">一个 AttackHitbox + CollisionShape2D</text><text x="46" y="245" font-size="17" fill="#334155">十四个语义动作，素材时长保持</text><text x="46" y="272" font-size="17" fill="#334155">CharacterBody2D 实例化表现场景</text></a><a href="../../../data/animation/sunwukong_visual.tscn"><rect x="530" y="115" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 115H960Q970 115 970 125V161H530V125Q530 115 540 115" fill="#fef3c7"/><text x="546" y="145" font-size="21" fill="#0f172a">主 AnimationPlayer</text><text x="546" y="191" font-size="17" fill="#334155">idle / move / run / attack_1…5 / …</text><text x="546" y="218" font-size="17" fill="#334155">TYPE_ANIMATION → 原生子播放器</text><text x="546" y="245" font-size="17" fill="#334155">预览 action / time 属性轨道</text><text x="546" y="272" font-size="17" fill="#334155">编辑器拖动 ↔ Spine 原素材姿态</text></a><a href="../animation/spine_animation_adapter.gd"><rect x="1030" y="115" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 115H1460Q1470 115 1470 125V161H1030V125Q1030 115 1040 115" fill="#fef3c7"/><text x="1046" y="145" font-size="21" fill="#0f172a">SpineAnimationTrack</text><text x="1046" y="191" font-size="17" fill="#334155">SpineSprite 的直接子节点</text><text x="1046" y="218" font-size="17" fill="#334155">预置子 AnimationPlayer，复用原生 clip</text><text x="1046" y="245" font-size="17" fill="#334155">44 个素材动作及循环版本</text><text x="1046" y="272" font-size="17" fill="#334155">保留槽位、附件、皮肤与层序</text></a><a href="../runtime/battle_action_state_machine_2d.gd"><rect x="30" y="465" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 465H460Q470 465 470 475V511H30V475Q30 465 40 465" fill="#dbeafe"/><text x="46" y="495" font-size="21" fill="#0f172a">BattleClock / Core 状态机</text><text x="46" y="541" font-size="17" fill="#334155">唯一 combat delta：暂停、慢动作、停顿</text><text x="46" y="568" font-size="17" fill="#334155">许可、死亡、打断与落地由状态决定</text><text x="46" y="595" font-size="17" fill="#334155">通过动作名称命令适配器</text><text x="46" y="622" font-size="17" fill="#334155">动画完成只通知</text></a><a href="../animation/spine_animation_adapter.gd"><rect x="530" y="465" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 465H960Q970 465 970 475V511H530V475Q530 465 540 465" fill="#dbeafe"/><text x="546" y="495" font-size="21" fill="#0f172a">SpineAnimationAdapter</text><text x="546" y="541" font-size="17" fill="#334155">获取场景节点，不 new/add_child</text><text x="546" y="568" font-size="17" fill="#334155">play / advance / playback_position</text><text x="546" y="595" font-size="17" fill="#334155">主时间同步 Spine，手动模式</text><text x="546" y="622" font-size="17" fill="#334155">朝向与换装不重置播放器时间</text></a><a href="../../../data/battle2d/attack4.tres"><rect x="1030" y="465" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 465H1460Q1470 465 1470 475V511H1030V475Q1030 465 1040 465" fill="#fce7f3"/><text x="1046" y="495" font-size="21" fill="#0f172a">GAS 技能定义 / 帧事件</text><text x="1046" y="541" font-size="17" fill="#334155">ability_id + hit_index → 命中 payload</text><text x="1046" y="568" font-size="17" fill="#334155">hit_rect / hit_scale_x,y / hit_offset</text><text x="1046" y="595" font-size="17" fill="#334155">source_frame / fps → 预览当前命中</text><text x="1046" y="622" font-size="17" fill="#334155">修改技能数据，复用同一形状</text></a><a href="../runtime/battle_entity_2d.gd"><rect x="30" y="815" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 815H460Q470 815 470 825V861H30V825Q30 815 40 815" fill="#dbeafe"/><text x="46" y="845" font-size="21" fill="#0f172a">GAS → Core impact → Entity2D</text><text x="46" y="891" font-size="17" fill="#334155">素材帧决定判定时机与命中序号</text><text x="46" y="918" font-size="17" fill="#334155">读取实例技能 → 配置唯一形状</text><text x="46" y="945" font-size="17" fill="#334155">攻击实例 → 独立受击区域 / 去重</text><text x="46" y="972" font-size="17" fill="#334155">DamageCalculator → HealthVital</text></a><a href="../movement/battle_hitbox_2d.gd"><rect x="530" y="815" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 815H960Q970 815 970 825V861H530V825Q530 815 540 815" fill="#fce7f3"/><text x="546" y="845" font-size="21" fill="#0f172a">BattleHitbox2D : Area2D</text><text x="546" y="891" font-size="17" fill="#334155">唯一 CollisionShape2D / RectangleShape2D</text><text x="546" y="918" font-size="17" fill="#334155">技能矩形 → 正缩放 → 偏移 → 比例</text><text x="546" y="945" font-size="17" fill="#334155">右向局部框 → 镜像 → 世界多边形</text><text x="546" y="972" font-size="17" fill="#334155">无效数据清空，不沿用上一击范围</text></a><a href="../../../data/animation/README.md"><rect x="1030" y="815" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 815H1460Q1470 815 1470 825V861H1030V825Q1030 815 1040 815" fill="#dcfce7"/><text x="1046" y="845" font-size="21" fill="#0f172a">实例隔离与新角色</text><text x="1046" y="891" font-size="17" fill="#334155">矩形 Local To Scene：按实例复制</text><text x="1046" y="918" font-size="17" fill="#334155">技能实例定义独立，预览引用只读</text><text x="1046" y="945" font-size="17" fill="#334155">新角色只配一个框和技能数据</text><text x="1046" y="972" font-size="17" fill="#334155">调整范围无需改公共角色代码</text></a><path d="M470 220H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="210" font-size="15" fill="#334155">预置</text><path d="M970 220H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="982" y="210" font-size="15" fill="#334155">clip</text><path d="M750 465V330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="405" font-size="15" fill="#334155">控制</text><path d="M470 565H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="553" font-size="15" fill="#334155">命令</text><path d="M900 330V380H1250V465" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1040" y="372" font-size="15" fill="#334155">预览轨道</text><path d="M1250 680V740H750V815" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="884" y="730" font-size="15" fill="#334155">读取并更新</text><path d="M470 915H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="903" font-size="15" fill="#334155">查询</text><path d="M970 915H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="982" y="903" font-size="15" fill="#334155">隔离</text><text x="32" y="1080" font-size="18" fill="#334155">每个实体始终只有一个攻击框：素材矩形、缩放和偏移读取技能数据；第四段双击仍各自去重，同一形状更新。</text></svg>
