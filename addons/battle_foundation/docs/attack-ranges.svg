<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-label="孙悟空 · 五段原版 ABRect 与命中坐标"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">孙悟空 · 五段原版 ABRect 与命中坐标</text><text x="32" y="80" font-size="18" fill="#334155">原单位横向投影，脚底 X=0；纵向数据列于每行下方。游戏场景按 2 倍转换。</text><path d="M450 112V625" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/><text x="459" y="125" font-size="16" fill="#059669">脚底原点</text><text x="32" y="190" font-size="21" fill="#0f172a">attack_1</text><rect x="313.20000000000005" y="160" width="320.4" height="42" rx="5" fill="#dbeafe" stroke="#64748b"/><text x="313.20000000000005" y="152" font-size="16" fill="#334155">-114</text><text x="621.6" y="152" font-size="16" fill="#334155">153</text><text x="195" y="227" font-size="17" fill="#334155">ABRect(-114, -104.95, 267, 99.95)</text><text x="32" y="285" font-size="21" fill="#0f172a">attack_2</text><rect x="399.6" y="255" width="252.06" height="42" rx="5" fill="#dbeafe" stroke="#64748b"/><text x="399.6" y="247" font-size="16" fill="#334155">-42</text><text x="639.66" y="247" font-size="16" fill="#334155">168.05</text><text x="195" y="322" font-size="17" fill="#334155">ABRect(-42, -90.95, 210.05, 114.95)</text><text x="32" y="380" font-size="21" fill="#0f172a">attack_3</text><rect x="244.8" y="350" width="386.4" height="42" rx="5" fill="#dbeafe" stroke="#64748b"/><text x="244.8" y="342" font-size="16" fill="#334155">-171</text><text x="619.2" y="342" font-size="16" fill="#334155">151</text><text x="195" y="417" font-size="17" fill="#334155">ABRect(-171, -103.95, 322, 133.95)</text><text x="32" y="475" font-size="21" fill="#0f172a">attack_4</text><rect x="336.18" y="445" width="226.38" height="42" rx="5" fill="#fef3c7" stroke="#64748b"/><text x="336.18" y="437" font-size="16" fill="#334155">-94.85</text><text x="550.5600000000001" y="437" font-size="16" fill="#334155">93.8</text><text x="195" y="512" font-size="17" fill="#334155">ABRect(-94.85, -105.95, 188.65, 159.95)</text><text x="32" y="570" font-size="21" fill="#0f172a">attack_5</text><rect x="367.2" y="540" width="388.8" height="42" rx="5" fill="#dbeafe" stroke="#64748b"/><text x="367.2" y="532" font-size="16" fill="#334155">-69</text><text x="744" y="532" font-size="16" fill="#334155">255</text><text x="195" y="607" font-size="17" fill="#334155">ABRect(-69, -159.95, 324, 184.95)</text><a href="../../../data/characters/sunwukong/skills/attack_hitboxes_source.json"><rect x="935" y="140" width="535" height="205" rx="10" fill="white" stroke="#94a3b8"/><path d="M945 140H1460Q1470 140 1470 150V186H935V150Q935 140 945 140" fill="#dcfce7"/><text x="951" y="170" font-size="21" fill="#0f172a">原版碰撞数据链</text><text x="951" y="216" font-size="17" fill="#334155">attackV427.swf：abs / ABConfigs</text><text x="951" y="243" font-size="17" fill="#334155">getAbRects(shootAssetLink)</text><text x="951" y="270" font-size="17" fill="#334155">SkillControl.reBuilBodyBox → sensor</text><text x="951" y="297" font-size="17" fill="#334155">AI atkRange 不参与伤害矩形</text></a><a href="../../../data/battle2d/attack4.tres"><rect x="935" y="405" width="535" height="205" rx="10" fill="white" stroke="#94a3b8"/><path d="M945 405H1460Q1470 405 1470 415V451H935V415Q935 405 945 405" fill="#fef3c7"/><text x="951" y="435" font-size="21" fill="#0f172a">第四段第二击</text><text x="951" y="481" font-size="17" fill="#334155">ABRect 与第一击相同</text><text x="951" y="508" font-size="17" fill="#334155">显示 scaleX=-1 不反转碰撞框</text><text x="951" y="535" font-size="17" fill="#334155">局部偏移 (-17,-4)，再按朝向镜像</text><text x="951" y="562" font-size="17" fill="#334155">跟随角色位置，保留技能位移</text></a><a href="../movement/battle_hitbox_2d.gd"><rect x="30" y="685" width="690" height="175" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 685H710Q720 685 720 695V731H30V695Q30 685 40 685" fill="#dbeafe"/><text x="46" y="715" font-size="21" fill="#0f172a">技能数据驱动统一框</text><text x="46" y="761" font-size="17" fill="#334155">每击：hit_rect → 正缩放 → 偏移 → 素材比例</text><text x="46" y="788" font-size="17" fill="#334155">更新同一个 CollisionShape2D → 镜像 → 世界变换</text><text x="46" y="815" font-size="17" fill="#334155">修改技能判定数据，预览与伤害范围一起更新</text></a><a href="../../../examples/verify_stage_four.gd"><rect x="780" y="685" width="690" height="175" rx="10" fill="white" stroke="#94a3b8"/><path d="M790 685H1460Q1470 685 1470 695V731H780V695Q780 685 790 685" fill="#e2e8f0"/><text x="796" y="715" font-size="21" fill="#0f172a">命中边界与当前运行方式</text><text x="796" y="761" font-size="17" fill="#334155">每段、每击、左右方向都验证前后边界与框外</text><text x="796" y="788" font-size="17" fill="#334155">独立受击区域 → 攻击实例去重 → GAS / Vital</text><text x="796" y="815" font-size="17" fill="#334155">五连击默认瞬时查询；单段验收支持持续窗口</text></a></svg>
