<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1310" viewBox="0 0 1520 1310" role="img" aria-label="Buff、被动与战斗触发 · 系统联合类图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">Buff、被动与战斗触发 · 系统联合类图</text><text x="32" y="82" font-size="18" fill="#334155">复用 GAS 状态/效果与 Core 事件；定义只读、每次实例来源独立，公共表现属于战斗会话。</text><a href="../../gameplay_abiltiy_system/scripts/status/gameplay_status_data.gd"><rect x="30" y="120" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 120H480Q490 120 490 130V166H30V130Q30 120 40 120" fill="#dcfce7"/><text x="46" y="150" font-size="21" fill="#0f172a">GameplayStatusData</text><text x="46" y="196" font-size="17" fill="#334155">duration / max_stacks / stacking_group</text><text x="46" y="223" font-size="17" fill="#334155">tags / apply_effects / features</text><text x="46" y="250" font-size="17" fill="#334155">remove_on_death / initial_update_delta</text><text x="46" y="277" font-size="17" fill="#334155">施加时深复制完整资源图</text></a><a href="../../gameplay_abiltiy_system/scripts/components/gameplay_status_component.gd"><rect x="530" y="120" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 120H980Q990 120 990 130V166H530V130Q530 120 540 120" fill="#dbeafe"/><text x="546" y="150" font-size="21" fill="#0f172a">GameplayStatusComponent</text><text x="546" y="196" font-size="17" fill="#334155">active: Array[Instance]</text><text x="546" y="223" font-size="17" fill="#334155">匹配group + 直接被动来源</text><text x="546" y="250" font-size="17" fill="#334155">apply_status / remove_instance</text><text x="546" y="277" font-size="17" fill="#334155">快照遍历 / 外部 combat delta</text></a><a href="../../gameplay_abiltiy_system/scripts/status/gameplay_status_instance.gd"><rect x="1030" y="120" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 120H1480Q1490 120 1490 130V166H1030V130Q1030 120 1040 120" fill="#dbeafe"/><text x="1046" y="150" font-size="21" fill="#0f172a">GameplayStatusInstance</text><text x="1046" y="196" font-size="17" fill="#334155">stacks / remaining / elapsed / removed</text><text x="1046" y="223" font-size="17" fill="#334155">instigator WeakRef / effect_state</text><text x="1046" y="250" font-size="17" fill="#334155">每实例 source_id / Feature storage</text><text x="1046" y="277" font-size="17" fill="#334155">到期、覆盖、驱散、死亡幂等移除</text></a><a href="../gas/battle_original_status_policy.gd"><rect x="30" y="410" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 410H480Q490 410 490 420V456H30V420Q30 410 40 410" fill="#dcfce7"/><text x="46" y="440" font-size="21" fill="#0f172a">BattleOriginalStatusPolicy</text><text x="46" y="486" font-size="17" fill="#334155">继承 GAS StatusStackingPolicy</text><text x="46" y="513" font-size="17" fill="#334155">0拒绝 / 1覆盖 / 2周期timer比较</text><text x="46" y="540" font-size="17" fill="#334155">3独立实例 / 基础4、5叠层 / 6延时</text><text x="46" y="567" font-size="17" fill="#334155">GAS策略保留；同组不同ID可合并</text></a><a href="../../gameplay_abiltiy_system/scripts/status/features/feature_periodic_effects.gd"><rect x="530" y="410" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 410H980Q990 410 990 420V456H530V420Q530 410 540 410" fill="#dbeafe"/><text x="546" y="440" font-size="21" fill="#0f172a">StatusFeature / PeriodicEffects</text><text x="546" y="486" font-size="17" fill="#334155">apply / update / event / remove</text><text x="546" y="513" font-size="17" fill="#334155">循环补算截止到期的所有周期</text><text x="546" y="540" font-size="17" fill="#334155">实例计时；可配置 trigger_on_apply</text><text x="546" y="567" font-size="17" fill="#334155">PassiveStatusFeature 持有实例WeakRef</text></a><a href="../../gameplay_abiltiy_system/scripts/effects/gameplay_effect.gd"><rect x="1030" y="410" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 410H1480Q1490 410 1490 420V456H1030V420Q1030 410 1040 410" fill="#fef3c7"/><text x="1046" y="440" font-size="21" fill="#0f172a">GameplayEffect + 原版效果</text><text x="1046" y="486" font-size="17" fill="#334155">Attribute / PeriodicVital / Shield</text><text x="1046" y="513" font-size="17" fill="#334155">DamageRules / ReflectDamage</text><text x="1046" y="540" font-size="17" fill="#334155">reapply_on_stack 仅重放持续效果</text><text x="1046" y="567" font-size="17" fill="#334155">状态、治疗等组合效果统一调用</text></a><a href="../runtime/battle_attribute_component.gd"><rect x="30" y="700" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 700H480Q490 700 490 710V746H30V710Q30 700 40 700" fill="#dbeafe"/><text x="46" y="730" font-size="21" fill="#0f172a">BattleAttributeComponent / Vital</text><text x="46" y="776" font-size="17" fill="#334155">按 status.instance 来源修正属性</text><text x="46" y="803" font-size="17" fill="#334155">覆盖/叠层使用嵌套事务</text><text x="46" y="830" font-size="17" fill="#334155">current health 与 hpMax 分开</text><text x="46" y="857" font-size="17" fill="#334155">健康比例变化与统一属性通知</text></a><a href="../gas/battle_trigger_feature.gd"><rect x="530" y="700" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 700H980Q990 700 990 710V746H530V710Q530 700 540 700" fill="#fef3c7"/><text x="546" y="730" font-size="21" fill="#0f172a">BattleTriggerFeature</text><text x="546" y="776" font-size="17" fill="#334155">SOURCE / TARGET / EITHER 身份</text><text x="546" y="803" font-size="17" fill="#334155">OWNER / SOURCE / TARGET 接收者</text><text x="546" y="830" font-size="17" fill="#334155">概率 / 冷却 / 生命阈值穿越</text><text x="546" y="857" font-size="17" fill="#334155">实例busy + trigger_chain去重</text></a><a href="../../gameplay_abiltiy_system/scripts/effects/gameplay_trigger_guard.gd"><rect x="1030" y="700" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 700H1480Q1490 700 1490 710V746H1030V710Q1030 700 1040 700" fill="#fee2e2"/><text x="1046" y="730" font-size="21" fill="#0f172a">GameplayTriggerGuard</text><text x="1046" y="776" font-size="17" fill="#334155">嵌套入口预算 MAX_DEPTH = 16</text><text x="1046" y="803" font-size="17" fill="#334155">apply_status / effect apply / remove</text><text x="1046" y="830" font-size="17" fill="#334155">次生伤害默认不触发普通被动</text><text x="1046" y="857" font-size="17" fill="#334155">允许次生时链内也不重复自身</text></a><a href="../runtime/battle_entity_2d.gd"><rect x="30" y="990" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 990H480Q490 990 490 1000V1036H30V1000Q30 990 40 990" fill="#dbeafe"/><text x="46" y="1020" font-size="21" fill="#0f172a">Core动作状态 / GAS标签</text><text x="46" y="1066" font-size="17" fill="#334155">state.stunned → Core STUN</text><text x="46" y="1093" font-size="17" fill="#334155">无敌 / 霸体使用标签引用计数</text><text x="46" y="1120" font-size="17" fill="#334155">宿主 can_use_ability 阻止绕过</text><text x="46" y="1147" font-size="17" fill="#334155">死亡最高优先；离场注销状态机</text></a><a href="../runtime/battle_session.gd"><rect x="530" y="990" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 990H980Q990 990 990 1000V1036H530V1000Q530 990 540 990" fill="#e2e8f0"/><text x="546" y="1020" font-size="21" fill="#0f172a">BattleSession + Core EventBus</text><text x="546" y="1066" font-size="17" fill="#334155">cast → effective → settled → received</text><text x="546" y="1093" font-size="17" fill="#334155">killed / health.changed / 次生伤害</text><text x="546" y="1120" font-size="17" fill="#334155">battle/entity/damage身份与触发链</text><text x="546" y="1147" font-size="17" fill="#334155">统一时钟 + 共享血条/数字/反馈</text></a><a href="../combat/battle_original_damage_strategy.gd"><rect x="1030" y="990" width="460" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 990H1480Q1490 990 1490 1000V1036H1030V1000Q1030 990 1040 990" fill="#fef3c7"/><text x="1046" y="1020" font-size="21" fill="#0f172a">BattleOriginalDamageStrategy</text><text x="1046" y="1066" font-size="17" fill="#334155">damage_buffs → 盾前吸血 → 护盾</text><text x="1046" y="1093" font-size="17" fill="#334155">最终普通+真实伤害作为反伤基准</text><text x="1046" y="1120" font-size="17" fill="#334155">DamageInfo保留请求/实际回复</text><text x="1046" y="1147" font-size="17" fill="#334155">实际扣血 / 吸收 / 闪避 / 暴击</text></a><path d="M490 210H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="492" y="190" font-size="15" fill="#334155">定义</text><path d="M990 210H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="992" y="190" font-size="15" fill="#334155">持有</text><path d="M260 410V370H750V330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="405" y="358" font-size="15" fill="#334155">裁决分组与策略</text><path d="M1260 330V365H750V410" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="921" y="356" font-size="15" fill="#334155">驱动Feature</text><path d="M1260 330V410" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1280" y="371" font-size="15" fill="#334155">执行效果</text><path d="M750 620V700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="671" font-size="15" fill="#334155">事件Feature</text><path d="M1260 620V700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1275" y="671" font-size="15" fill="#334155">递归约束</text><path d="M1030 545H1010V660H260V700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="481" y="653" font-size="15" fill="#334155">记录/撤销自己的修改来源</text><path d="M260 910V990" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="275" y="962" font-size="15" fill="#334155">标签与控制</text><path d="M750 990V910" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="962" font-size="15" fill="#334155">统一事件通知</text><path d="M1030 1090H990" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="958" y="1242" font-size="15" fill="#334155">发布结构化结果</text><text x="32" y="1270" font-size="18" fill="#334155">原版配置与组合验收被动分开；周期只执行有效区间，Buff结束/死亡/离场撤销来源、计时、标签与Cue。</text></svg>
