<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" role="img" aria-label="孙悟空 · 动画适配层与战斗状态联合类图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">孙悟空 · 动画适配层与战斗状态联合类图</text><text x="32" y="80" font-size="18" fill="#334155">动作名称属于战斗接口；Spine 细节在适配层内部，生命与技能许可仍由战斗状态管理。</text><a href="../runtime/battle_session.gd"><rect x="30" y="110" width="440" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 110H460Q470 110 470 120V156H30V120Q30 110 40 110" fill="#dbeafe"/><text x="46" y="140" font-size="21" fill="#0f172a">BattleSession / BattleClock</text><text x="46" y="186" font-size="17" fill="#334155">固定物理 tick → 唯一 combat delta</text><text x="46" y="213" font-size="17" fill="#334155">暂停、慢动作、受击停顿统一处理</text><text x="46" y="240" font-size="17" fill="#334155">spawn_entity_2d：独立 GAS 与姿态</text></a><a href="../definitions/battle_action_profile_2d.gd"><rect x="530" y="110" width="440" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 110H960Q970 110 970 120V156H530V120Q530 110 540 110" fill="#dcfce7"/><text x="546" y="140" font-size="21" fill="#0f172a">BattleActionProfile2D</text><text x="546" y="186" font-size="17" fill="#334155">普攻锁定 10 帧 / 受击锁定 8 帧</text><text x="546" y="213" font-size="17" fill="#334155">原版攻击区域：0,-200,130,300</text><text x="546" y="240" font-size="17" fill="#334155">平台样例重力、跳跃速度</text></a><a href="../animation/character_animation_profile.gd"><rect x="1030" y="110" width="440" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 110H1460Q1470 110 1470 120V156H1030V120Q1030 110 1040 110" fill="#dcfce7"/><text x="1046" y="140" font-size="21" fill="#0f172a">CharacterAnimationProfile</text><text x="1046" y="186" font-size="17" fill="#334155">战斗动作名 → 原版 Spine 动作名</text><text x="1046" y="213" font-size="17" fill="#334155">30 fps / 循环 / 固定脚底偏移</text><text x="1046" y="240" font-size="17" fill="#334155">基础皮肤 / 显示比例 / 骨骼挂点</text></a><a href="../../godot_core_system-0.0.4/source/event_system/event_bus.gd"><rect x="30" y="390" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 390H460Q470 390 470 400V436H30V400Q30 390 40 390" fill="#e2e8f0"/><text x="46" y="420" font-size="21" fill="#0f172a">Core EventBus</text><text x="46" y="466" font-size="17" fill="#334155">battle.attack.impact：第 4 / 30 秒</text><text x="46" y="493" font-size="17" fill="#334155">battle.attack.hit：阵营 + 区域判定</text><text x="46" y="520" font-size="17" fill="#334155">battle.animation_completed：仅通知</text><text x="46" y="547" font-size="17" fill="#334155">同步伤害引用沿用 GAS/Core</text></a><a href="../runtime/battle_entity_2d.gd"><rect x="530" y="390" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 390H960Q970 390 970 400V436H530V400Q530 390 540 390" fill="#dbeafe"/><text x="546" y="420" font-size="21" fill="#0f172a">BattleEntity2D</text><text x="546" y="466" font-size="17" fill="#334155">CharacterBody2D：脚底为原点</text><text x="546" y="493" font-size="17" fill="#334155">独立 BattleActionState2D</text><text x="546" y="520" font-size="17" fill="#334155">使用动作名称命令表现层</text><text x="546" y="547" font-size="17" fill="#334155">物理体不缩放，朝向不镜像物理体</text></a><a href="../animation/character_animation_adapter.gd"><rect x="1030" y="390" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 390H1460Q1470 390 1470 400V436H1030V400Q1030 390 1040 390" fill="#fef3c7"/><text x="1046" y="420" font-size="21" fill="#0f172a">CharacterAnimationAdapter</text><text x="1046" y="466" font-size="17" fill="#334155">play_action / set_facing / set_skins</text><text x="1046" y="493" font-size="17" fill="#334155">set_equipment_skin / progress / socket</text><text x="1046" y="520" font-size="17" fill="#334155">完成与循环通知，不决定战斗许可</text><text x="1046" y="547" font-size="17" fill="#334155">抽象 Node2D，可换其他动画后端</text></a><a href="../runtime/battle_gas_binding.gd"><rect x="30" y="700" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 700H460Q470 700 470 710V746H30V710Q30 700 40 700" fill="#dbeafe"/><text x="46" y="730" font-size="21" fill="#0f172a">GAS 运行实例</text><text x="46" y="776" font-size="17" fill="#334155">BattleGASBinding：共用 2D/3D 装配</text><text x="46" y="803" font-size="17" fill="#334155">属性 atk、phyDef、hpMax / Vital</text><text x="46" y="830" font-size="17" fill="#334155">sunwukong_attack1：30 fps / 10 帧</text><text x="46" y="857" font-size="17" fill="#334155">生命耗尽 → 立即进入 DEAD</text></a><a href="../runtime/battle_action_state_2d.gd"><rect x="530" y="700" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 700H960Q970 700 970 710V746H530V710Q530 700 540 700" fill="#fce7f3"/><text x="546" y="730" font-size="21" fill="#0f172a">BattleActionState2D</text><text x="546" y="776" font-size="17" fill="#334155">IDLE / MOVE / RUN / TAKEOFF / AIR / LAND</text><text x="546" y="803" font-size="17" fill="#334155">ATTACK / HURT：技能与规则时间锁定</text><text x="546" y="830" font-size="17" fill="#334155">DEAD：不可攻击，不被动画复活</text><text x="546" y="857" font-size="17" fill="#334155">grounded 由运动控制器决定</text></a><a href="../animation/spine_animation_adapter.gd"><rect x="1030" y="700" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 700H1460Q1470 700 1470 710V746H1030V710Q1030 700 1040 700" fill="#fef3c7"/><text x="1046" y="730" font-size="21" fill="#0f172a">SpineAnimationAdapter</text><text x="1046" y="776" font-size="17" fill="#334155">独立 SpineSprite / TrackEntry / Skin</text><text x="1046" y="803" font-size="17" fill="#334155">Manual：只消费 combat delta</text><text x="1046" y="830" font-size="17" fill="#334155">原版附件注册点、槽位层序保留</text><text x="1046" y="857" font-size="17" fill="#334155">共用只读 skel/atlas，不共用姿态</text></a><path d="M250 295V345H750V390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="510" y="336" font-size="15" fill="#334155">驱动</text><path d="M750 295V390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="345" font-size="15" fill="#334155">规则</text><path d="M1250 295V390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1266" y="345" font-size="15" fill="#334155">映射</text><path d="M530 470H470" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="479" y="459" font-size="15" fill="#334155">事件</text><path d="M970 470H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="972" y="448" font-size="15" fill="#334155">动作命令</text><path d="M1030 555H970" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="972" y="578" font-size="15" fill="#334155">完成通知</text><path d="M650 600V650H250V700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="322" y="641" font-size="15" fill="#334155">持有并推进</text><path d="M750 600V700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="657" font-size="15" fill="#334155">持有</text><path d="M1250 700V600" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1266" y="657" font-size="15" fill="#334155">实现接口</text><text x="32" y="970" font-size="18" fill="#334155">换皮肤：构造实例专属组合皮肤 → 重新应用当前时刻姿态；不重启 TrackEntry，不移动角色，不写共享配置。</text></svg>
