<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="875" viewBox="0 0 1400 875" role="img" aria-label="孙悟空 · 脚底原点、装备挂点与攻击镜像"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">孙悟空 · 脚底原点、装备挂点与攻击镜像</text><text x="32" y="80" font-size="18" fill="#334155">原版骨架保持素材帧、附件偏移和层序；Root 固定在脚底，表现偏移与战斗判定分别配置。</text><path d="M175 485H465" stroke="#64748b" stroke-width="2"/><rect x="92" y="275.1" width="534" height="199.9" fill="#fef3c7" stroke="#f59e0b"/><rect x="298" y="305" width="44" height="180" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M306 485H334M320 471V499" stroke="#10b981" stroke-width="3"/><path d="M320 330L440 340" stroke="#64748b" stroke-width="8"/><circle cx="440" cy="340" r="6" fill="#f59e0b"/><text x="252" y="525" font-size="18" fill="#334155">角色原点 (0,0)</text><text x="220" y="260" font-size="18" fill="#334155">物理体始终不翻转</text><text x="190" y="125" font-size="24" fill="#334155">右向：完整 ABRect</text><path d="M925 485H1215" stroke="#64748b" stroke-width="2"/><rect x="764" y="275.1" width="534" height="199.9" fill="#fef3c7" stroke="#f59e0b"/><rect x="1048" y="305" width="44" height="180" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M1056 485H1084M1070 471V499" stroke="#10b981" stroke-width="3"/><path d="M1070 330L950 340" stroke="#64748b" stroke-width="8"/><circle cx="950" cy="340" r="6" fill="#f59e0b"/><text x="1002" y="525" font-size="18" fill="#334155">角色原点 (0,0)</text><text x="970" y="260" font-size="18" fill="#334155">物理体始终不翻转</text><text x="940" y="125" font-size="24" fill="#334155">左向：完整镜像</text><a href="../animation/spine_animation_adapter.gd"><rect x="30" y="615" width="650" height="175" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 615H670Q680 615 680 625V661H30V625Q30 615 40 615" fill="#fef3c7"/><text x="46" y="645" font-size="21" fill="#0f172a">表现坐标</text><text x="46" y="691" font-size="17" fill="#334155">固定 skeleton_offset=(0,-4.2384)，display_scale=2</text><text x="46" y="718" font-size="17" fill="#334155">保留原 atlas trim 与附件 x/y，按原 drawOrder 显示</text><text x="46" y="745" font-size="17" fill="#334155">骨架 scale_x=±1；武器三个原骨骼挂点一起镜像</text></a><a href="../runtime/battle_entity_2d.gd"><rect x="710" y="615" width="650" height="175" rx="10" fill="white" stroke="#94a3b8"/><path d="M720 615H1350Q1360 615 1360 625V661H710V625Q710 615 720 615" fill="#dbeafe"/><text x="726" y="645" font-size="21" fill="#0f172a">战斗区域：第一段原版 ABRect</text><text x="726" y="691" font-size="17" fill="#334155">右：Rect2(-114,-104.95,267,99.95) × 2</text><text x="726" y="718" font-size="17" fill="#334155">左：Rect2(-153,-104.95,267,99.95) × 2</text><text x="726" y="745" font-size="17" fill="#334155">实际尺寸 534 × 199.9；包含脚底两侧</text></a><text x="32" y="835" font-size="18" fill="#334155">攻击范围以角色脚底为原点；皮肤与武器长度不改变它。完成事件不决定地面状态、攻击许可或死亡状态。</text></svg>
