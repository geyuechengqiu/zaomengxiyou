<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1240" viewBox="0 0 1500 1240" role="img" aria-label="阶段8原版伤害联合类图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#334155">阶段8 · 原版伤害计算与现有插件联合运行</text><text x="32" y="80" font-size="18" fill="#334155">GAS 负责属性、状态与 Vital，Core 分发同步事件；原版策略只读定义，每次命中共享一个结果。</text><a href="../../../data/damage/README.md"><rect x="30" y="120" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><rect x="30" y="120" width="440" height="46" rx="10" fill="#dcfce7"/><text x="46" y="151" font-size="21" fill="#334155">只读原版定义数据</text><text x="46" y="197" font-size="17" fill="#334155">220级 EXP 双等级换算参数</text><text x="46" y="226" font-size="17" fill="#334155">6411条技能倍率、附伤与专属参数</text><text x="46" y="255" font-size="17" fill="#334155">业务ID → 来源ID，配置不保存当前值</text><text x="46" y="284" font-size="17" fill="#334155">固定随机输入与来源SHA256</text></a><a href="../runtime/battle_session.gd"><rect x="530" y="120" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><rect x="530" y="120" width="440" height="46" rx="10" fill="#dcfce7"/><text x="546" y="151" font-size="21" fill="#334155">BattleSession / BattleRandom</text><text x="546" y="197" font-size="17" fill="#334155">damage_strategy：场景显式指定</text><text x="546" y="226" font-size="17" fill="#334155">场次种子 / combat 流 / 状态快照</text><text x="546" y="255" font-size="17" fill="#334155">命中 → 暴击 → 浮动随机消费</text><text x="546" y="284" font-size="17" fill="#334155">时间轴取消与命中去重继续生效</text></a><a href="../runtime/battle_attack_instance.gd"><rect x="1030" y="120" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><rect x="1030" y="120" width="440" height="46" rx="10" fill="#dcfce7"/><text x="1046" y="151" font-size="21" fill="#334155">时间轴与释放实例</text><text x="1046" y="197" font-size="17" fill="#334155">BattleFrameTimelineFeature</text><text x="1046" y="226" font-size="17" fill="#334155">攻击段倍率、子技能、附伤</text><text x="1046" y="255" font-size="17" fill="#334155">BattleAttackInstance 命中记录</text><text x="1046" y="284" font-size="17" fill="#334155">释放实例 / 段 / 目标 / 下次命中时间</text></a><a href="../runtime/battle_attribute_component.gd"><rect x="30" y="440" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><rect x="30" y="440" width="440" height="46" rx="10" fill="#dbeafe"/><text x="46" y="471" font-size="21" fill="#334155">GAS 最终属性</text><text x="46" y="517" font-size="17" fill="#334155">基础 → 成长 → 装备 → 临时 → 最终</text><text x="46" y="546" font-size="17" fill="#334155">当前生命独立于最大生命</text><text x="46" y="575" font-size="17" fill="#334155">atk / phyDef / 六种概率评分</text><text x="46" y="604" font-size="17" fill="#334155">light … ray 八种元素抗性</text></a><a href="../combat/battle_original_damage_strategy.gd"><rect x="530" y="440" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><rect x="530" y="440" width="440" height="46" rx="10" fill="#fef3c7"/><text x="546" y="471" font-size="21" fill="#334155">BattleOriginalDamageStrategy</text><text x="546" y="517" font-size="17" fill="#334155">继承 GAS DamageLogicStrategy</text><text x="546" y="546" font-size="17" fill="#334155">calculate_result → DamageInfo</text><text x="546" y="575" font-size="17" fill="#334155">原版截断点、分量与阶段追踪</text><text x="546" y="604" font-size="17" fill="#334155">应用阶段按原顺序处理规则与回调</text></a><a href="../combat/battle_damage_rules.gd"><rect x="1030" y="440" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><rect x="1030" y="440" width="440" height="46" rx="10" fill="#dbeafe"/><text x="1046" y="471" font-size="21" fill="#334155">BattleDamageRules</text><text x="1046" y="517" font-size="17" fill="#334155">每只实体独立的 RefCounted</text><text x="1046" y="546" font-size="17" fill="#334155">GAS Effect 按来源施加 / 撤销</text><text x="1046" y="575" font-size="17" fill="#334155">普通护盾 FIFO；真实分量穿盾</text><text x="1046" y="604" font-size="17" fill="#334155">概率Buff、增减伤、角色阶段钩子</text></a><a href="../../gameplay_abiltiy_system/scripts/damage/damage_info.gd"><rect x="30" y="760" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><rect x="30" y="760" width="440" height="46" rx="10" fill="#dbeafe"/><text x="46" y="791" font-size="21" fill="#334155">DamageCalculator / DamageInfo</text><text x="46" y="837" font-size="17" fill="#334155">计算伤害 / 普通与真实分量</text><text x="46" y="866" font-size="17" fill="#334155">盾吸收 / 生命前后 / 实际扣血</text><text x="46" y="895" font-size="17" fill="#334155">闪避 / 暴击 / 格挡 / 免疫</text><text x="46" y="924" font-size="17" fill="#334155">计算器生成的命中结果只应用一次</text></a><a href="../../gameplay_abiltiy_system/scripts/attributes/vitals/health_vital.gd"><rect x="530" y="760" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><rect x="530" y="760" width="440" height="46" rx="10" fill="#fef3c7"/><text x="546" y="791" font-size="21" fill="#334155">HealthVital.apply_damage</text><text x="546" y="837" font-size="17" fill="#334155">同步 damage_received / GAS Buff</text><text x="546" y="866" font-size="17" fill="#334155">策略后置流程 → 普通盾 → 扣血</text><text x="546" y="895" font-size="17" fill="#334155">死亡、damage_applied 与实际扣血</text><text x="546" y="924" font-size="17" fill="#334155">过量伤害和显示伤害分别保存</text></a><a href="../presentation/battle_combat_feedback_2d.gd"><rect x="1030" y="760" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><rect x="1030" y="760" width="440" height="46" rx="10" fill="#dbeafe"/><text x="1046" y="791" font-size="21" fill="#334155">Core 事件与战斗反馈</text><text x="1046" y="837" font-size="17" fill="#334155">battle.attack.hit：同一结果对象</text><text x="1046" y="866" font-size="17" fill="#334155">飘字 / 生命面板 / 被动入口</text><text x="1046" y="895" font-size="17" fill="#334155">整数显示，概率与倍率显示百分比</text><text x="1046" y="924" font-size="17" fill="#334155">毫秒显示；内部保持原版 Number</text></a><path d="M250 335V392H685V440" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="290" y="382" font-size="15" fill="#334155">只读参数</text><path d="M750 335V440" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="395" font-size="15" fill="#334155">场次策略 / 随机</text><path d="M1250 335V395H815V440" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1020" y="383" font-size="15" fill="#334155">单次命中</text><path d="M470 530H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="479" y="518" font-size="15" fill="#334155">读取</text><path d="M1030 530H970" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="518" font-size="15" fill="#334155">规则</text><path d="M660 655V705H250V760" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="694" font-size="15" fill="#334155">计算结果</text><path d="M470 858H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="479" y="845" font-size="15" fill="#334155">应用</text><path d="M750 760V655" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="725" font-size="15" fill="#334155">后置结算</text><path d="M970 858H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="845" font-size="15" fill="#334155">通知</text><rect x="30" y="1050" width="1440" height="155" rx="10" fill="#e2e8f0"/><text x="48" y="1082" font-size="21" fill="#334155">原版关键顺序（每个箭头对应 trace 的一个阶段）</text><text x="48" y="1116" font-size="18" fill="#334155">命中 → 暴击 → 物理截断 → 暴击截断 → 抗性截断 → 真实拆分 → 增减伤 → Buff / 吸血</text><text x="48" y="1150" font-size="18" fill="#334155">实体附伤 / 生命比例 → 转移 / 无伤 → 普通盾 → 格挡 / 追加 → 盾后补1 → 分摊 / 最终 / 免疫 → 生命</text><text x="48" y="1184" font-size="17" fill="#334155">验收：普通80 / 暴击160 / 火抗40 / 附伤127；计算80−吸收50=扣血30，剩余5时实际只扣5。</text></svg>
