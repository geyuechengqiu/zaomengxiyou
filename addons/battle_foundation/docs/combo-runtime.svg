.tres"><rect x="622" y="120" width="256" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M632 120H868Q878 120 878 130V166H622V130Q622 120 632 120" fill="#dbeafe"/><text x="638" y="150" font-size="21" fill="#0f172a">attack_3</text><text x="638" y="196" font-size="17" fill="#334155">sunwukong_attack3</text><text x="638" y="223" font-size="17" fill="#334155">12 帧 / 0.400 秒</text><text x="638" y="250" font-size="17" fill="#334155">命中帧 2 · ×1.2</text></a><path d="M878 210H918" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="0" font-size="15" fill="#334155"></text><a href="../../../data/battle2d/attack4.tres"><rect x="918" y="120" width="256" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M928 120H1164Q1174 120 1174 130V166H918V130Q918 120 928 120" fill="#fef3c7"/><text x="934" y="150" font-size="21" fill="#0f172a">attack_4</text><text x="934" y="196" font-size="17" fill="#334155">sunwukong_attack4</text><text x="934" y="223" font-size="17" fill="#334155">18 帧 / 0.600 秒</text><text x="934" y="250" font-size="17" fill="#334155">命中帧 0、8 · 各 ×0.45</text></a><path d="M1174 210H1214" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="0" font-size="15" fill="#334155"></text><a href="../../../data/battle2d/attack5.tres"><rect x="1214" y="120" width="256" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M1224 120H1460Q1470 120 1470 130V166H1214V130Q1214 120 1224 120" fill="#dbeafe"/><text x="1230" y="150" font-size="21" fill="#0f172a">attack_5</text><text x="1230" y="196" font-size="17" fill="#334155">sunwukong_attack5</text><text x="1230" y="223" font-size="17" fill="#334155">20 帧 / 0.667 秒</text><text x="1230" y="250" font-size="17" fill="#334155">命中帧 6 · ×2.0</text></a><text x="32" y="354" font-size="18" fill="#334155">下一段必须满足：当前 GAS 已结束 + 已预约 + 存活 + 地面支撑；否则结束连击回运动状态。</text><a href="../definitions/battle_combo_definition.gd"><rect x="30" y="415" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 415H460Q470 415 470 425V461H30V425Q30 415 40 415" fill="#dcfce7"/><text x="46" y="445" font-size="21" fill="#0f172a">BattleComboDefinition : Resource</text><text x="46" y="491" font-size="17" fill="#334155">steps: BattleAttackStep2D[]</text><text x="46" y="518" font-size="17" fill="#334155">语义 ID / 原生动作 / 30 FPS 时长</text><text x="46" y="545" font-size="17" fill="#334155">每段跳取消 / 霸体 / 优先级</text><text x="46" y="572" font-size="17" fill="#334155">第 4 段：300 px/s × 前 16 帧</text></a><a href="../runtime/battle_combo_state.gd"><rect x="530" y="415" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 415H960Q970 415 970 425V461H530V425Q530 415 540 415" fill="#dbeafe"/><text x="546" y="445" font-size="21" fill="#0f172a">BattleComboState : RefCounted</text><text x="546" y="491" font-size="17" fill="#334155">index / queued_next / cast_serial</text><text x="546" y="518" font-size="17" fill="#334155">当前段只预约下一段一次</text><text x="546" y="545" font-size="17" fill="#334155">仅负责连击推进与预约</text><text x="546" y="572" font-size="17" fill="#334155">命中集合交给 BattleAttackInstance</text></a><a href="../../gameplay_abiltiy_system/scripts/abilities/gameplay_ability_instance.gd"><rect x="1030" y="415" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 415H1460Q1470 415 1470 425V461H1030V425Q1030 415 1040 415" fill="#fef3c7"/><text x="1046" y="445" font-size="21" fill="#0f172a">GameplayAbilityInstance</text><text x="1046" y="491" font-size="17" fill="#334155">每段独立激活 / 黑板 / elapsed</text><text x="1046" y="518" font-size="17" fill="#334155">BattleFrameTimelineFeature 游标</text><text x="1046" y="545" font-size="17" fill="#334155">Core battle.attack.impact → 宿主</text><text x="1046" y="572" font-size="17" fill="#334155">取消后不发未来事件</text></a><path d="M470 510H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="497" font-size="15" fill="#334155">读取</text><path d="M970 510H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="497" font-size="15" fill="#334155">激活</text><a href="../runtime/battle_entity_2d.gd"><rect x="30" y="755" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 755H460Q470 755 470 765V801H30V765Q30 755 40 755" fill="#fee2e2"/><text x="46" y="785" font-size="21" fill="#0f172a">打断与控制权</text><text x="46" y="831" font-size="17" fill="#334155">普通受击：门槛与霸体判定</text><text x="46" y="858" font-size="17" fill="#334155">跳取消 / 离地：结束地面技能</text><text x="46" y="885" font-size="17" fill="#334155">菜单 / 失焦 / 暂停：撤销预约</text><text x="46" y="912" font-size="17" fill="#334155">死亡：清全部技能，强制 DEAD</text></a><a href="../runtime/battle_entity_2d.gd"><rect x="530" y="755" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 755H960Q970 755 970 765V801H530V765Q530 755 540 755" fill="#dbeafe"/><text x="546" y="785" font-size="21" fill="#0f172a">BattleEntity2D：镜像与命中</text><text x="546" y="831" font-size="17" fill="#334155">所有技能复用一个 BattleHitbox2D</text><text x="546" y="858" font-size="17" fill="#334155">从实例技能读取 hit_rect / 偏移</text><text x="546" y="885" font-size="17" fill="#334155">每击更新形状，再按朝向整体镜像</text><text x="546" y="912" font-size="17" fill="#334155">阵营过滤 / 同击目标去重</text></a><a href="../animation/spine_animation_adapter.gd"><rect x="1030" y="755" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 755H1460Q1470 755 1470 765V801H1030V765Q1030 755 1040 755" fill="#e2e8f0"/><text x="1046" y="785" font-size="21" fill="#0f172a">GAS Vital / AnimationAdapter</text><text x="1046" y="831" font-size="17" fill="#334155">DamageCalculator → HealthVital</text><text x="1046" y="858" font-size="17" fill="#334155">attack_1…5：原生 Spine 动作</text><text x="1046" y="885" font-size="17" fill="#334155">独立动画实例，与段时间同步</text><text x="1046" y="912" font-size="17" fill="#334155">换装不修改时长、位置或规则</text></a><path d="M250 755V690H750V625" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="679" font-size="15" fill="#334155">取消 / 清预约</text><path d="M1250 625V690H750V755" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1017" y="680" font-size="15" fill="#334155">素材帧事件</text><path d="M970 852H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="835" font-size="15" fill="#334155">调用</text><text x="32" y="1020" font-size="18" fill="#334155">迁移边界：动作、时长、倍率、第四段位移与 ABRect 已接入；原版完整击退、特效与 sensor 流程仍待迁移。</text></svg>
