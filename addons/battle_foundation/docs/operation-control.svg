<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-label="角色操作 · 输入缓存、战斗时间与控制权"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">角色操作 · 输入缓存、战斗时间与控制权</text><text x="32" y="80" font-size="18" fill="#334155">输入时间按真实物理秒推进；战斗执行按 combat delta 推进，窗口和规则分别管理。</text><a href="../../godot_core_system-0.0.4/source/operation_system/operation_controller.gd"><rect x="30" y="120" width="440" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 120H460Q470 120 470 130V166H30V130Q30 120 40 120" fill="#fef3c7"/><text x="46" y="150" font-size="21" fill="#0f172a">输入 tick：unscaled delta</text><text x="46" y="196" font-size="17" fill="#334155">长按 / 双击 / 缓存过期</text><text x="46" y="223" font-size="17" fill="#334155">受击停顿仍识别，超时即丢弃</text><text x="46" y="250" font-size="17" fill="#334155">按下 → 缓存 → 等待许可</text></a><a href="../input/battle_player_operations.gd"><rect x="530" y="120" width="440" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 120H960Q970 120 970 130V166H530V130Q530 120 540 120" fill="#dbeafe"/><text x="546" y="150" font-size="21" fill="#0f172a">固定战斗 tick：combat delta</text><text x="546" y="196" font-size="17" fill="#334155">移动 / 跳跃 / 技能 / 动画</text><text x="546" y="223" font-size="17" fill="#334155">慢动作同步缩放，停顿不执行</text><text x="546" y="250" font-size="17" fill="#334155">许可未成立 → RETRY 留队列</text></a><a href="../../godot_core_system-0.0.4/source/operation_system/operation_buffer.gd"><rect x="1030" y="120" width="440" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 120H1460Q1470 120 1470 130V166H1030V130Q1030 120 1040 120" fill="#dcfce7"/><text x="1046" y="150" font-size="21" fill="#0f172a">最终消费 / 过期</text><text x="1046" y="196" font-size="17" fill="#334155">许可通过 → ACCEPTED 消费一次</text><text x="1046" y="223" font-size="17" fill="#334155">未装配 → UNAVAILABLE 消费</text><text x="1046" y="250" font-size="17" fill="#334155">超时不在恢复后补发攻击</text></a><path d="M470 207H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="194" font-size="15" fill="#334155">缓存</text><path d="M970 207H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="194" font-size="15" fill="#334155">结果</text><a href="../../godot_core_system-0.0.4/source/operation_system/operation_controller.gd"><rect x="30" y="420" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 420H460Q470 420 470 430V466H30V430Q30 420 40 420" fill="#fee2e2"/><text x="46" y="450" font-size="21" fill="#0f172a">失去控制权</text><text x="46" y="496" font-size="17" fill="#334155">菜单 / 失焦 / 改键 / 控制者切换</text><text x="46" y="523" font-size="17" fill="#334155">暂停 / time_scale=0 / 死亡</text><text x="46" y="550" font-size="17" fill="#334155">立即清移动、奔跑、队列与双击</text><text x="46" y="577" font-size="17" fill="#334155">cancelled release 只取消蓄力</text></a><a href="../runtime/battle_session.gd"><rect x="530" y="420" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 420H960Q970 420 970 430V466H530V430Q530 420 540 420" fill="#e2e8f0"/><text x="546" y="450" font-size="21" fill="#0f172a">独立原因集合</text><text x="546" y="496" font-size="17" fill="#334155">每个入口添加自己的 reason</text><text x="546" y="523" font-size="17" fill="#334155">关闭菜单只移除菜单的 reason</text><text x="546" y="550" font-size="17" fill="#334155">仍失焦时继续阻断所有来源</text><text x="546" y="577" font-size="17" fill="#334155">恢复 API 立即同步，不等下 tick</text></a><a href="../input/battle_operation_menu.gd"><rect x="1030" y="420" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 420H1460Q1470 420 1470 430V466H1030V430Q1030 420 1040 420" fill="#dcfce7"/><text x="1046" y="450" font-size="21" fill="#0f172a">重新接受输入</text><text x="1046" y="496" font-size="17" fill="#334155">所有原因移除后才获得控制</text><text x="1046" y="523" font-size="17" fill="#334155">旧持有键先松开再重新按下</text><text x="1046" y="550" font-size="17" fill="#334155">UI 已消费按下不进入角色</text><text x="1046" y="577" font-size="17" fill="#334155">UI 吞松键也不会卡住移动</text></a><path d="M470 512H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="500" font-size="15" fill="#334155">撤回</text><path d="M970 512H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="500" font-size="15" fill="#334155">恢复</text><text x="32" y="716" font-size="19" fill="#334155">例：菜单打开 + 窗口失焦 → 关闭菜单仍无控制权 → 焦点恢复 → 松开旧键 → 新按下生效。</text><text x="32" y="756" font-size="18" fill="#334155">重映射：选择意图 → remapping 阻断 → 捕获新键 → 校验/保存/InputMap → 释放新键 → 返回角色。</text></svg>
