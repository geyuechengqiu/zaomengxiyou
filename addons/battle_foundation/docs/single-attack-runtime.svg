<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1380" viewBox="0 0 1500 1380" role="img" aria-label="阶段 6 · 单段攻击、受击区域与反馈联合类图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">阶段 6 · 单段攻击、受击区域与反馈联合类图</text><text x="32" y="82" font-size="18" fill="#334155">Core 操作与状态 → GAS 素材帧 → 单一攻击框 × 独立受击区域 → Vital 扣血 → 反馈 → 待机。</text><a href="../input/battle_player_operations.gd"><rect x="30" y="120" width="440" height="200" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 120H460Q470 120 470 130V166H30V130Q30 120 40 120" fill="#dcfce7"/><text x="46" y="150" font-size="21" fill="#0f172a">Core 输入与动作状态机</text><text x="46" y="196" font-size="17" fill="#334155">OperationController → attack 意图</text><text x="46" y="223" font-size="17" fill="#334155">BattlePlayerOperations → 当前叶子</text><text x="46" y="250" font-size="17" fill="#334155">许可 / ATTACK / HURT / DEAD</text><text x="46" y="277" font-size="17" fill="#334155">菜单释放输入并占用控制权</text></a><a href="../runtime/battle_entity_2d.gd"><rect x="530" y="120" width="440" height="200" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 120H960Q970 120 970 130V166H530V130Q530 120 540 120" fill="#dbeafe"/><text x="546" y="150" font-size="21" fill="#0f172a">BattleEntity2D : CharacterBody2D</text><text x="546" y="196" font-size="17" fill="#334155">组合运动 / 状态 / 技能 / 动画</text><text x="546" y="223" font-size="17" fill="#334155">每次施放创建独立攻击实例</text><text x="546" y="250" font-size="17" fill="#334155">验证场次 / 实体 / 技能 / 攻击编号</text><text x="546" y="277" font-size="17" fill="#334155">统一受击查询和伤害入口</text></a><a href="../gas/battle_frame_timeline_feature.gd"><rect x="1030" y="120" width="440" height="200" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 120H1460Q1470 120 1470 130V166H1030V130Q1030 120 1040 120" fill="#fef3c7"/><text x="1046" y="150" font-size="21" fill="#0f172a">GAS 技能 / FrameTimeline</text><text x="1046" y="196" font-size="17" fill="#334155">实例黑板：elapsed / next_event</text><text x="1046" y="223" font-size="17" fill="#334155">30 fps：第 4 帧发布 impact</text><text x="1046" y="250" font-size="17" fill="#334155">事件附加当前 attack_id</text><text x="1046" y="277" font-size="17" fill="#334155">第 10 帧结束实例技能</text></a><a href="../runtime/battle_attack_instance.gd"><rect x="30" y="415" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 415H460Q470 415 470 425V461H30V425Q30 415 40 415" fill="#fce7f3"/><text x="46" y="445" font-size="21" fill="#0f172a">BattleAttackInstance : RefCounted</text><text x="46" y="491" font-size="17" fill="#334155">attack_id / ability_id / attacker WeakRef</text><text x="46" y="518" font-size="17" fill="#334155">attacker_id / 起手阵营 / elapsed</text><text x="46" y="545" font-size="17" fill="#334155">windows[hit_index] / window_end</text><text x="46" y="572" font-size="17" fill="#334155">每击目标集合：先登记再扣血</text></a><a href="../movement/battle_hitbox_2d.gd"><rect x="530" y="415" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 415H960Q970 415 970 425V461H530V425Q530 415 540 415" fill="#fce7f3"/><text x="546" y="445" font-size="21" fill="#0f172a">BattleHitbox2D : Area2D</text><text x="546" y="491" font-size="17" fill="#334155">唯一 CollisionShape2D，读取技能数据</text><text x="546" y="518" font-size="17" fill="#334155">hit_rect → 正缩放 → 偏移 → 比例</text><text x="546" y="545" font-size="17" fill="#334155">以脚底镜像 → 世界多边形</text><text x="546" y="572" font-size="17" fill="#334155">窗口未结束：每个战斗 tick 查询</text></a><a href="../movement/battle_hurtbox_2d.gd"><rect x="1030" y="415" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 415H1460Q1470 415 1470 425V461H1030V425Q1030 415 1040 415" fill="#fce7f3"/><text x="1046" y="445" font-size="21" fill="#0f172a">BattleHurtbox2D : Area2D</text><text x="1046" y="491" font-size="17" fill="#334155">独立可编辑 RectangleShape2D</text><text x="1046" y="518" font-size="17" fill="#334155">vulnerable / get_polygon_global()</text><text x="1046" y="545" font-size="17" fill="#334155">多边形相交；不参与物理阻挡</text><text x="1046" y="572" font-size="17" fill="#334155">实例局部资源，不改共享模板</text></a><a href="../../gameplay_abiltiy_system/scripts/attributes/vitals/health_vital.gd"><rect x="30" y="740" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 740H460Q470 740 470 750V786H30V750Q30 740 40 740" fill="#fef3c7"/><text x="46" y="770" font-size="21" fill="#0f172a">GAS 伤害 / HealthVital</text><text x="46" y="816" font-size="17" fill="#334155">DamageCalculator 读取当前最终属性</text><text x="46" y="843" font-size="17" fill="#334155">临时公式：max(1, atk-phyDef) × 倍率</text><text x="46" y="870" font-size="17" fill="#334155">DamageInfo → apply_damage</text><text x="46" y="897" font-size="17" fill="#334155">生命耗尽 → Core DEAD / 取消攻击</text></a><a href="../presentation/battle_presentation_2d.gd"><rect x="530" y="740" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 740H960Q970 740 970 750V786H530V750Q530 740 540 740" fill="#e2e8f0"/><text x="546" y="770" font-size="21" fill="#0f172a">BattlePresentation2D</text><text x="546" y="816" font-size="17" fill="#334155">EntityViews → 目标血条 / 受击反馈</text><text x="546" y="843" font-size="17" fill="#334155">Core 命中事件 → 按目标分发</text><text x="546" y="870" font-size="17" fill="#334155">会话级 CanvasLayer / 共享跳字池</text><text x="546" y="897" font-size="17" fill="#334155">BattleSession 每 tick 统一推进一次</text></a><a href="../animation/animation_player_adapter_2d.gd"><rect x="1030" y="740" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 740H1460Q1470 740 1470 750V786H1030V750Q1030 740 1040 740" fill="#e2e8f0"/><text x="1046" y="770" font-size="21" fill="#0f172a">CharacterAnimationAdapter</text><text x="1046" y="816" font-size="17" fill="#334155">悟空：原有 Spine / AnimationPlayer</text><text x="1046" y="843" font-size="17" fill="#334155">木桩：AnimationPlayerAdapter2D</text><text x="1046" y="870" font-size="17" fill="#334155">hurt / death：场景预置动画</text><text x="1046" y="897" font-size="17" fill="#334155">动画完成只通知，不裁决战斗规则</text></a><a href="../runtime/battle_clock.gd"><rect x="30" y="1060" width="440" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 1060H460Q470 1060 470 1070V1106H30V1070Q30 1060 40 1060" fill="#dcfce7"/><text x="46" y="1090" font-size="21" fill="#0f172a">BattleClock / 生命周期</text><text x="46" y="1136" font-size="17" fill="#334155">暂停 / 停顿冻结，慢动作统一缩放</text><text x="46" y="1163" font-size="17" fill="#334155">打断 / 死亡 / 替换 / 退出关闭攻击</text><text x="46" y="1190" font-size="17" fill="#334155">attack.finished 每个实例只通知一次</text><text x="46" y="1217" font-size="17" fill="#334155">旧编号事件不能伤害新一次施放</text></a><a href="../../../data/battle2d/dummy/wooden_dummy.tscn"><rect x="530" y="1060" width="440" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 1060H960Q970 1060 970 1070V1106H530V1070Q530 1060 540 1060" fill="#dcfce7"/><text x="546" y="1090" font-size="21" fill="#0f172a">移动物理体：独立责任</text><text x="546" y="1136" font-size="17" fill="#334155">CharacterBody2D + CapsuleShape2D</text><text x="546" y="1163" font-size="17" fill="#334155">只负责地面 / 墙 / 平台 / 运动</text><text x="546" y="1190" font-size="17" fill="#334155">攻击框和受击框物理层均为 0</text><text x="546" y="1217" font-size="17" fill="#334155">木桩物理宽 44，受击宽 90</text></a><a href="../presentation/battle_hit_effect_2d.gd"><rect x="1030" y="1060" width="440" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 1060H1460Q1470 1060 1470 1070V1106H1030V1070Q1030 1060 1040 1060" fill="#dcfce7"/><text x="1046" y="1090" font-size="21" fill="#0f172a">BattleHitEffect2D / 预置场景</text><text x="1046" y="1136" font-size="17" fill="#334155">原版 11 帧 / 30 fps / pivot(72,73)</text><text x="1046" y="1163" font-size="17" fill="#334155">预置 Sprite2D / AnimationPlayer</text><text x="1046" y="1190" font-size="17" fill="#334155">场景 940×590；启动不新增节点</text><text x="1046" y="1217" font-size="17" fill="#334155">重载复位并注销旧运行注册</text></a><path d="M470 220H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="205" font-size="15" fill="#334155">意图</text><path d="M970 220H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="982" y="205" font-size="15" fill="#334155">激活</text><path d="M750 320V365H250V415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="355" font-size="15" fill="#334155">创建 / 管理</text><path d="M1250 320V365H900V415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1010" y="355" font-size="15" fill="#334155">素材帧事件</text><path d="M470 520H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="505" font-size="15" fill="#334155">去重</text><path d="M970 520H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="982" y="505" font-size="15" fill="#334155">相交</text><path d="M750 625V685H250V740" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="675" font-size="15" fill="#334155">敌对 / 存活 / 新命中</text><path d="M470 845H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="482" y="830" font-size="15" fill="#334155">通知</text><path d="M970 845H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="982" y="830" font-size="15" fill="#334155">表现</text><text x="32" y="1300" font-size="18" fill="#334155">时间线：起手 0 → 命中 [4/30, 6/30) 秒 → 收招 → 10/30 秒结束 / 待机；同一窗口同一目标只结算一次。</text><text x="32" y="1334" font-size="18" fill="#334155">2 帧持续窗口是阶段 6 的临时配置；未配置窗口的原五连击保持瞬时查询，原版完整 sensor 流程尚待迁移。</text></svg>
