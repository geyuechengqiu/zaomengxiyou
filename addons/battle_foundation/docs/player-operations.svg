<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-label="角色操作 · 输入、角色、技能与表现联合类图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">角色操作 · 输入、角色、技能与表现联合类图</text><text x="32" y="80" font-size="18" fill="#334155">Godot 输入 → 语义意图 → 战斗许可 → GAS 与动画；配置共享，控制器与缓存按实体独立。</text><a href="../../godot_core_system-0.0.4/source/operation_system/operation_bindings.gd"><rect x="30" y="115" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 115H460Q470 115 470 125V161H30V125Q30 115 40 115" fill="#e2e8f0"/><text x="46" y="145" font-size="21" fill="#0f172a">CoreOperationBindings</text><text x="46" y="191" font-size="17" fill="#334155">默认物理键 / 用户配置 / InputMap</text><text x="46" y="218" font-size="17" fill="#334155">捕获新键 / 冲突与保留键 / 保存</text><text x="46" y="245" font-size="17" fill="#334155">改键只影响输入层，角色不改代码</text><text x="46" y="272" font-size="17" fill="#334155">菜单暂停时 Always 运行</text></a><a href="../../godot_core_system-0.0.4/source/operation_system/operation_controller.gd"><rect x="530" y="115" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 115H960Q970 115 970 125V161H530V125Q530 115 540 115" fill="#dbeafe"/><text x="546" y="145" font-size="21" fill="#0f172a">CoreOperationController</text><text x="546" y="191" font-size="17" fill="#334155">原生 _unhandled_input：UI 优先</text><text x="546" y="218" font-size="17" fill="#334155">多来源强度 / 四阶段 / 长按 / 双击</text><text x="546" y="245" font-size="17" fill="#334155">控制权原因集合 / 来源释放隔离</text><text x="546" y="272" font-size="17" fill="#334155">未缩放 input_time / 精确消费</text></a><a href="../../godot_core_system-0.0.4/source/operation_system/operation_profile.gd"><rect x="1030" y="115" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 115H1460Q1470 115 1470 125V161H1030V125Q1030 115 1040 115" fill="#dcfce7"/><text x="1046" y="145" font-size="21" fill="#0f172a">CoreOperationProfile</text><text x="1046" y="191" font-size="17" fill="#334155">语义意图 → 原生动作 / 轴规则</text><text x="1046" y="218" font-size="17" fill="#334155">default_keys / reserved_keys</text><text x="1046" y="245" font-size="17" fill="#334155">缓存 0.2 s / 长按 0.3 s</text><text x="1046" y="272" font-size="17" fill="#334155">业务同方向双击 &lt; 0.5 s</text></a><a href="../input/battle_operation_menu.gd"><rect x="30" y="435" width="440" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 435H460Q470 435 470 445V481H30V445Q30 435 40 435" fill="#e2e8f0"/><text x="46" y="465" font-size="21" fill="#0f172a">BattleOperationMenu</text><text x="46" y="511" font-size="17" fill="#334155">模态 UI / Esc / 绑定设置</text><text x="46" y="538" font-size="17" fill="#334155">menu 原因与 remapping 独立</text><text x="46" y="565" font-size="17" fill="#334155">关闭菜单不会覆盖失焦控制权</text></a><a href="../input/battle_player_operations.gd"><rect x="530" y="435" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 435H960Q970 435 970 445V481H530V445Q530 435 540 435" fill="#dbeafe"/><text x="546" y="465" font-size="21" fill="#0f172a">BattlePlayerOperations</text><text x="546" y="511" font-size="17" fill="#334155">固定 tick 消费移动 / 跳跃 / 普攻</text><text x="546" y="538" font-size="17" fill="#334155">ability_slots：技能槽 → GAS ID</text><text x="546" y="565" font-size="17" fill="#334155">ACCEPTED / RETRY / UNAVAILABLE</text><text x="546" y="592" font-size="17" fill="#334155">公共操作后追加角色钩子</text></a><a href="../../godot_core_system-0.0.4/source/operation_system/operation_buffer.gd"><rect x="1030" y="435" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 435H1460Q1470 435 1470 445V481H1030V445Q1030 435 1040 435" fill="#fef3c7"/><text x="1046" y="465" font-size="21" fill="#0f172a">CoreOperationBuffer / Intent</text><text x="1046" y="511" font-size="17" fill="#334155">按下快照 / sequence / 持有时长</text><text x="1046" y="538" font-size="17" fill="#334155">有限队列 / 独立消费 / 过期</text><text x="1046" y="565" font-size="17" fill="#334155">短按不丢，连按各保留一次</text><text x="1046" y="592" font-size="17" fill="#334155">cancelled 释放只清理蓄力</text></a><a href="../runtime/battle_session.gd"><rect x="30" y="790" width="440" height="185" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 790H460Q470 790 470 800V836H30V800Q30 790 40 790" fill="#fef3c7"/><text x="46" y="820" font-size="21" fill="#0f172a">BattleSession / BattleClock</text><text x="46" y="866" font-size="17" fill="#334155">先推进未缩放输入时间</text><text x="46" y="893" font-size="17" fill="#334155">再计算 combat delta 驱动动作</text><text x="46" y="920" font-size="17" fill="#334155">暂停立即同步控制权</text></a><a href="../runtime/battle_entity_2d.gd"><rect x="530" y="790" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 790H960Q970 790 970 800V836H530V800Q530 790 540 790" fill="#dbeafe"/><text x="546" y="820" font-size="21" fill="#0f172a">BattleEntity2D / ActionState</text><text x="546" y="866" font-size="17" fill="#334155">落地 / 受击 / 死亡决定许可</text><text x="546" y="893" font-size="17" fill="#334155">try_jump / try_attack / skill</text><text x="546" y="920" font-size="17" fill="#334155">生命与冷却仍属于运行实例</text><text x="546" y="947" font-size="17" fill="#334155">动作名称命令独立动画适配</text></a><a href="../animation/character_animation_adapter.gd"><rect x="1030" y="790" width="440" height="210" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 790H1460Q1470 790 1470 800V836H1030V800Q1030 790 1040 790" fill="#e2e8f0"/><text x="1046" y="820" font-size="21" fill="#0f172a">GAS / AnimationAdapter</text><text x="1046" y="866" font-size="17" fill="#334155">GameplayAbilityComponent：技能</text><text x="1046" y="893" font-size="17" fill="#334155">Vital / Status：生命与状态</text><text x="1046" y="920" font-size="17" fill="#334155">Spine：动作、朝向、皮肤、进度</text><text x="1046" y="947" font-size="17" fill="#334155">完成通知不授予战斗许可</text></a><path d="M470 205H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="195" font-size="15" fill="#334155">映射</text><path d="M1030 205H970" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="195" font-size="15" fill="#334155">定义</text><path d="M250 435V325" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="266" y="386" font-size="15" fill="#334155">改键</text><path d="M750 325V435" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="386" font-size="15" fill="#334155">意图</text><path d="M470 527H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="515" font-size="15" fill="#334155">占用</text><path d="M1030 550H970" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="537" font-size="15" fill="#334155">队列</text><path d="M750 645V790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="728" font-size="15" fill="#334155">尝试执行 / 许可</text><path d="M470 880H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="868" font-size="15" fill="#334155">调度</text><path d="M970 880H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="979" y="868" font-size="15" fill="#334155">调用</text><text x="32" y="1060" font-size="18" fill="#334155">角色可继承 BattlePlayerOperations：专属按下、公共分支后置、held/released、cancelled 清理。</text></svg>
