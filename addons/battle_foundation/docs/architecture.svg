<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150" role="img" aria-label="阶段 1 · 定义、战斗实例与插件协作"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">阶段 1 · 定义、战斗实例与插件协作</text><text x="32" y="77" font-size="18" fill="#334155">Core 提供基础服务，GAS 保存战斗实例；新增插件定义统一的入口与时间规则。</text><a href="../../godot_core_system-0.0.4/source/core_system.gd"><rect x="30" y="105" width="440" height="175" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 105H460Q470 105 470 115V151H30V115Q30 105 40 105" fill="#e2e8f0"/><text x="46" y="135" font-size="21" fill="#0f172a">CoreSystem</text><text x="46" y="181" font-size="17" fill="#334155">ResourceManager：缓存加载</text><text x="46" y="208" font-size="17" fill="#334155">ConfigManager：用户选项</text><text x="46" y="235" font-size="17" fill="#334155">EventBus：同步事件与共享 DamageInfo</text></a><a href="../runtime/battle_catalog.gd"><rect x="530" y="105" width="440" height="175" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 105H960Q970 105 970 115V151H530V115Q530 105 540 105" fill="#dcfce7"/><text x="546" y="135" font-size="21" fill="#0f172a">BattleCatalog</text><text x="546" y="181" font-size="17" fill="#334155">manifest：类别 + 定义 ID → 路径</text><text x="546" y="208" font-size="17" fill="#334155">类型、依赖、帧顺序校验</text><text x="546" y="235" font-size="17" fill="#334155">出口：独立的定义资源图</text></a><a href="../definitions/battle_entity_definition.gd"><rect x="1030" y="105" width="440" height="215" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 105H1460Q1470 105 1470 115V151H1030V115Q1030 105 1040 105" fill="#dcfce7"/><text x="1046" y="135" font-size="21" fill="#0f172a">Resource 定义</text><text x="1046" y="181" font-size="17" fill="#334155">BattleEntityDefinition / EquipmentDefinition</text><text x="1046" y="208" font-size="17" fill="#334155">BattleLevelDefinition / SpawnDefinition</text><text x="1046" y="235" font-size="17" fill="#334155">GameplayAbilityDefinition / StatusData</text><text x="1046" y="262" font-size="17" fill="#334155">BattleFrameEvent：原素材帧事件</text></a><a href="../runtime/battle_system.gd"><rect x="30" y="365" width="440" height="175" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 365H460Q470 365 470 375V411H30V375Q30 365 40 365" fill="#dbeafe"/><text x="46" y="395" font-size="21" fill="#0f172a">BattleSystem</text><text x="46" y="441" font-size="17" fill="#334155">Autoload：会话 ID 分配</text><text x="46" y="468" font-size="17" fill="#334155">读取 Core 用户配置</text><text x="46" y="495" font-size="17" fill="#334155">create_session(parent, manifest, seed)</text></a><a href="../runtime/battle_session.gd"><rect x="530" y="365" width="440" height="175" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 365H960Q970 365 970 375V411H530V375Q530 365 540 365" fill="#dbeafe"/><text x="546" y="395" font-size="21" fill="#0f172a">BattleSession</text><text x="546" y="441" font-size="17" fill="#334155">场次 ID / 实体注册 / 关卡与装备实例</text><text x="546" y="468" font-size="17" fill="#334155">_physics_process → advance_physics</text><text x="546" y="495" font-size="17" fill="#334155">publish_event → Core EventBus</text></a><a href="../runtime/battle_clock.gd"><rect x="1030" y="365" width="440" height="175" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 365H1460Q1470 365 1470 375V411H1030V375Q1030 365 1040 365" fill="#fef3c7"/><text x="1046" y="395" font-size="21" fill="#0f172a">BattleClock</text><text x="1046" y="441" font-size="17" fill="#334155">累计战斗时间 / 物理 tick / last_delta</text><text x="1046" y="468" font-size="17" fill="#334155">暂停、慢动作、停顿与部分 tick</text><text x="1046" y="495" font-size="17" fill="#334155">不重置技能、不补算暂停积压</text></a><a href="../runtime/battle_factions.gd"><rect x="30" y="640" width="440" height="150" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 640H460Q470 640 470 650V686H30V650Q30 640 40 640" fill="#dbeafe"/><text x="46" y="670" font-size="21" fill="#0f172a">BattleFactions</text><text x="46" y="716" font-size="17" fill="#334155">实体运行阵营与双向/单向关系</text><text x="46" y="743" font-size="17" fill="#334155">同阵营友好，未登记组合中立</text></a><a href="../runtime/battle_entity.gd"><rect x="530" y="640" width="440" height="190" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 640H960Q970 640 970 650V686H530V650Q530 640 540 640" fill="#dbeafe"/><text x="546" y="670" font-size="21" fill="#0f172a">BattleEntity : CharacterBody3D</text><text x="546" y="716" font-size="17" fill="#334155">entity_id 与 definition_id 分开</text><text x="546" y="743" font-size="17" fill="#334155">三个 GAS 组件使用外部时钟</text><text x="546" y="770" font-size="17" fill="#334155">move_and_collide(velocity × delta)</text><text x="546" y="797" font-size="17" fill="#334155">退出撤销状态/技能并注销 ID</text></a><a href="../runtime/battle_random.gd"><rect x="1030" y="640" width="440" height="150" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 640H1460Q1470 640 1470 650V686H1030V650Q1030 640 1040 640" fill="#dbeafe"/><text x="1046" y="670" font-size="21" fill="#0f172a">BattleRandom</text><text x="1046" y="716" font-size="17" fill="#334155">场次种子 + 命名随机流</text><text x="1046" y="743" font-size="17" fill="#334155">combat / loot / spawn；快照与恢复</text></a><a href="../runtime/battle_equipment_state.gd"><rect x="30" y="930" width="440" height="150" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 930H460Q470 930 470 940V976H30V940Q30 930 40 930" fill="#dbeafe"/><text x="46" y="960" font-size="21" fill="#0f172a">BattleEquipmentState</text><text x="46" y="1006" font-size="17" fill="#334155">instance_id / 当前 durability</text><text x="46" y="1033" font-size="17" fill="#334155">独立定义及修改器子资源</text></a><a href="../../gameplay_abiltiy_system/scripts/components/gameplay_vital_attribute_component.gd"><rect x="530" y="930" width="440" height="175" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 930H960Q970 930 970 940V976H530V940Q530 930 540 930" fill="#e2e8f0"/><text x="546" y="960" font-size="21" fill="#0f172a">GAS 实例系统</text><text x="546" y="1006" font-size="17" fill="#334155">属性与 Vital：当前值及恢复</text><text x="546" y="1033" font-size="17" fill="#334155">技能黑板：剩余冷却、运行禁用状态</text><text x="546" y="1060" font-size="17" fill="#334155">状态实例：持续时间、层数和 Feature</text></a><a href="../gas/battle_frame_timeline_feature.gd"><rect x="1030" y="930" width="440" height="175" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 930H1460Q1470 930 1470 940V976H1030V940Q1030 930 1040 930" fill="#fef3c7"/><text x="1046" y="960" font-size="21" fill="#0f172a">BattleFrameTimelineFeature</text><text x="1046" y="1006" font-size="17" fill="#334155">source_fps / duration_frames / events</text><text x="1046" y="1033" font-size="17" fill="#334155">elapsed 与事件游标存于技能黑板</text><text x="1046" y="1060" font-size="17" fill="#334155">跨帧逐个发布 Core 原素材事件</text></a><path d="M470 190H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="180" font-size="15" fill="#334155">加载</text><path d="M1030 190H970" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="978" y="180" font-size="15" fill="#334155">索引</text><path d="M470 445H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="435" font-size="15" fill="#334155">创建</text><path d="M750 280V365" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="333" font-size="15" fill="#334155">定义实例</text><path d="M1030 445H970" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="981" y="435" font-size="15" fill="#334155">delta</text><path d="M750 540V640" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="592" font-size="15" fill="#334155">固定物理调度</text><path d="M470 715H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="705" font-size="15" fill="#334155">查询</text><path d="M970 715H1030" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="981" y="705" font-size="15" fill="#334155">调用</text><path d="M750 830V930" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="888" font-size="15" fill="#334155">持有并驱动</text><path d="M1030 1005H970" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="970" y="898" font-size="15" fill="#334155">GAS Feature</text><path d="M530 510H490V900H250V930" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="286" y="890" font-size="15" fill="#334155">创建装备实例</text></svg>
