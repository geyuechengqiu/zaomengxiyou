<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1090" viewBox="0 0 1500 1090" role="img" aria-label="基础、成长、装备、临时与最终属性 · 插件联合类图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}a{text-decoration:none}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#0f172a">基础、成长、装备、临时与最终属性 · 插件联合类图</text><text x="32" y="82" font-size="18" fill="#334155">最终属性由 GAS 计算；成长、装备与临时属性按来源管理，当前生命/魔法独立存在 Vital。</text><a href="../definitions/battle_entity_definition.gd"><rect x="30" y="115" width="440" height="205" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 115H460Q470 115 470 125V161H30V125Q30 115 40 115" fill="#dcfce7"/><text x="46" y="145" font-size="21" fill="#0f172a">BattleEntityDefinition</text><text x="46" y="191" font-size="17" fill="#334155">attribute_set：一级基础值</text><text x="46" y="218" font-size="17" fill="#334155">progression / initial_level</text><text x="46" y="245" font-size="17" fill="#334155">BattleGASBinding：2D / 3D 共用装配</text></a><a href="../definitions/battle_attribute_progression.gd"><rect x="530" y="115" width="440" height="205" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 115H960Q970 115 970 125V161H530V125Q530 115 540 115" fill="#dcfce7"/><text x="546" y="145" font-size="21" fill="#0f172a">BattleAttributeProgression</text><text x="546" y="191" font-size="17" fill="#334155">growth_per_level：原版 Add 增量</text><text x="546" y="218" font-size="17" fill="#334155">experience_per_level：EXP 升级表</text><text x="546" y="245" font-size="17" fill="#334155">maximum_level：可配置等级上限</text></a><a href="../definitions/battle_inventory_equipment.gd"><rect x="1030" y="115" width="440" height="205" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 115H1460Q1470 115 1470 125V161H1030V125Q1030 115 1040 115" fill="#dcfce7"/><text x="1046" y="145" font-size="21" fill="#0f172a">BattleEquipmentDefinition</text><text x="1046" y="191" font-size="17" fill="#334155">attribute_modifiers：只读修改器模板</text><text x="1046" y="218" font-size="17" fill="#334155">BattleInventoryEquipment : Equip</text><text x="1046" y="245" font-size="17" fill="#334155">槽位与耐久状态独立管理</text></a><a href="../../gameplay_abiltiy_system/scripts/components/gameplay_attribute_component.gd"><rect x="30" y="415" width="440" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 415H460Q470 415 470 425V461H30V425Q30 415 40 415" fill="#dbeafe"/><text x="46" y="445" font-size="21" fill="#0f172a">GAS 属性组件与实例</text><text x="46" y="491" font-size="17" fill="#334155">GameplayAttributeInstance：最终缓存</text><text x="46" y="518" font-size="17" fill="#334155">(base + ΣADD) × (1 + ΣMULTIPLY)</text><text x="46" y="545" font-size="17" fill="#334155">OVERRIDE / 最终取整 / 范围限制</text><text x="46" y="572" font-size="17" fill="#334155">begin_update / end_update：嵌套事务</text></a><a href="../runtime/battle_attribute_component.gd"><rect x="530" y="415" width="440" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 415H960Q970 415 970 425V461H530V425Q530 415 540 415" fill="#fef3c7"/><text x="546" y="445" font-size="21" fill="#0f172a">BattleAttributeComponent</text><text x="546" y="491" font-size="17" fill="#334155">继承 GameplayVitalAttributeComponent</text><text x="546" y="518" font-size="17" fill="#334155">基础 → growth.level → equipment.&lt;slot&gt;</text><text x="546" y="545" font-size="17" fill="#334155">临时 status.&lt;instance&gt; → GAS final</text><text x="546" y="572" font-size="17" fill="#334155">等级、经验、换装、Buff 共用入口</text></a><a href="../../gameplay_abiltiy_system/scripts/status/gameplay_status_instance.gd"><rect x="1030" y="415" width="440" height="235" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 415H1460Q1470 415 1470 425V461H1030V425Q1030 415 1040 415" fill="#dbeafe"/><text x="1046" y="445" font-size="21" fill="#0f172a">GAS Status / Effect</text><text x="1046" y="491" font-size="17" fill="#334155">GE_AttributeModifier：克隆模板</text><text x="1046" y="518" font-size="17" fill="#334155">Status：叠层、时钟、到期与移除</text><text x="1046" y="545" font-size="17" fill="#334155">同来源撤销，叠层不残留旧修改器</text><text x="1046" y="572" font-size="17" fill="#334155">临时值不修改共享配置</text></a><a href="../../gameplay_abiltiy_system/scripts/attributes/vitals/gameplay_vital.gd"><rect x="30" y="790" width="440" height="220" rx="10" fill="white" stroke="#94a3b8"/><path d="M40 790H460Q470 790 470 800V836H30V800Q30 790 40 790" fill="#dbeafe"/><text x="46" y="820" font-size="21" fill="#0f172a">HealthVital / ManaVital</text><text x="46" y="866" font-size="17" fill="#334155">当前 hp / mp 与 hpMax / mpMax 分开</text><text x="46" y="893" font-size="17" fill="#334155">升级补基础+成长+装备上限</text><text x="46" y="920" font-size="17" fill="#334155">换装 / Buff 保留当前值并截断</text><text x="46" y="947" font-size="17" fill="#334155">可选保留比例 / 回满 / 补差额</text></a><a href="../../../examples/wukong_platform_demo.gd"><rect x="530" y="790" width="440" height="220" rx="10" fill="white" stroke="#94a3b8"/><path d="M540 790H960Q970 790 970 800V836H530V800Q530 790 540 790" fill="#e2e8f0"/><text x="546" y="820" font-size="21" fill="#0f172a">完整快照、面板与战斗</text><text x="546" y="866" font-size="17" fill="#334155">snapshot_changed：Vital同步后通知</text><text x="546" y="893" font-size="17" fill="#334155">Core：battle.attributes.changed</text><text x="546" y="920" font-size="17" fill="#334155">面板 / 下一次攻击读取相同 get_value</text><text x="546" y="947" font-size="17" fill="#334155">get_breakdown：解释属性来源</text></a><a href="../../simple_inventory/src/core/C_Inventory.gd"><rect x="1030" y="790" width="440" height="220" rx="10" fill="white" stroke="#94a3b8"/><path d="M1040 790H1460Q1470 790 1470 800V836H1030V800Q1030 790 1040 790" fill="#dbeafe"/><text x="1046" y="820" font-size="21" fill="#0f172a">Simple Inventory · C_Inventory</text><text x="1046" y="866" font-size="17" fill="#334155">equip_changed(slot, item)</text><text x="1046" y="893" font-size="17" fill="#334155">bind_inventory：连接 / 初次同步</text><text x="1046" y="920" font-size="17" fill="#334155">换装备：同槽来源原子替换</text><text x="1046" y="947" font-size="17" fill="#334155">卸装：删除该槽全部加成</text></a><path d="M250 320V360H630V415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="282" y="350" font-size="15" fill="#334155">独占 GAS 实例</text><path d="M750 320V415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="388" font-size="15" fill="#334155">等级 / 经验</text><path d="M1250 320V360H870V415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1040" y="350" font-size="15" fill="#334155">装备模板</text><path d="M530 505H470" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="405" y="400" font-size="15" fill="#334155">继承 / 计算</text><path d="M1030 535H970" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1000" y="400" font-size="15" fill="#334155">修改器来源</text><path d="M250 650V790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="267" y="725" font-size="15" fill="#334155">属性上限变化</text><path d="M750 650V790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="766" y="725" font-size="15" fill="#334155">最终值 / 完整通知</text><path d="M470 897H530" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="478" y="885" font-size="15" fill="#334155">当前值</text><path d="M1250 790V705H915V650" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1035" y="693" font-size="15" fill="#334155">槽位变化 → 替换来源</text><text x="32" y="1050" font-size="18" fill="#334155">配置只读；每个实体的属性、修改器、经验、Vital 和状态独立。卸装与状态到期按来源清理。</text></svg>
