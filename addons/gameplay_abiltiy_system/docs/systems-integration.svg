<text x="72" y="1486" class="step" text-anchor="start">跨系统桥梁与宿主接口</text><text x="72" y="1520" class="note" text-anchor="start">宿主实体持有顶部三个组件；Vital 已继承属性容器。GameplayAbilitySystem 按 getter / get_component / 节点名查询。</text><text x="72" y="1549" class="note" text-anchor="start">TagManager：状态添加标签；目标策略、过滤器和 Effect 查询标签。AbilityEventBus：同步通知状态 Feature 和宿主。</text><text x="72" y="1578" class="note" text-anchor="start">DamageCalculator：Effect 使用伤害策略读取属性；HealthVital 在扣血前让事件状态修改同一个 DamageInfo。</text><text x="72" y="1607" class="note" text-anchor="start">UI / 输入 / 预览位于入口；按钮与预览本身不会自动释放技能，宿主提供目标、动画、挂点及场景。</text><text x="72" y="1636" class="note" text-anchor="start">清理链：状态 remove → Effect.remove → 按 source_id 撤销修改器 → 属性信号 → Vital 上限刷新。</text>
