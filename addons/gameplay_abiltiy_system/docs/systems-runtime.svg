<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1730" viewBox="0 0 1840 1730" role="img" aria-labelledby="title description">
<title id="title">各系统联合运行：增益、攻击、事件减伤与清理</title><desc id="description">条件分支以虚线连接；数值示例展示共享属性 / DamageInfo 和状态生命周期如何影响最终效果</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#52637a" stroke-width="1.4"/></marker>
  <marker id="inherit" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L16 8L0 16Z" fill="white" stroke="#52637a" stroke-width="1.4"/></marker>
  <marker id="owned" viewBox="-9 -7 18 14" refX="0" refY="0" markerWidth="13" markerHeight="11" orient="auto"><path d="M-8 0L0 -6L8 0L0 6Z" fill="#52637a" stroke="#52637a"/></marker>
  <marker id="shared" viewBox="-9 -7 18 14" refX="0" refY="0" markerWidth="13" markerHeight="11" orient="auto"><path d="M-8 0L0 -6L8 0L0 6Z" fill="white" stroke="#52637a"/></marker>
</defs>
<style>
  text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#243449}
  .title{font-size:34px;font-weight:700}.subtitle{font-size:20px;fill:#53657c}
  .name{font-family:Consolas,'Microsoft YaHei',monospace;font-size:22px;font-weight:700}
  .type{font-size:16px;fill:#596c84}.body{font-family:Consolas,'Microsoft YaHei',monospace;font-size:18px}
  .label{font-size:17px;paint-order:stroke;stroke:#fbfcff;stroke-width:6px;stroke-linejoin:round}
  .note{font-size:19px;fill:#52637a}.step{font-size:22px;font-weight:700}
  .edge{fill:none;stroke:#52637a;stroke-width:2}.dependency{stroke-dasharray:8 6}
</style>
<rect width="1840" height="1730" fill="#fbfcff"/>
<text x="50" y="60" class="title" text-anchor="start">各系统联合运行：增益、攻击、事件减伤与清理</text><text x="50" y="98" class="subtitle" text-anchor="start">条件分支以虚线连接；数值示例展示共享属性 / DamageInfo 和状态生命周期如何影响最终效果</text>
<rect x="60" y="145" width="400" height="1535" rx="12" fill="#eaf0f7"/><text x="260" y="185" class="step" text-anchor="middle">宿主 / 技能 / 行为树</text><rect x="500" y="145" width="400" height="1535" rx="12" fill="#f3f6fb"/><text x="700" y="185" class="step" text-anchor="middle">Effect / 载具入口</text><rect x="940" y="145" width="400" height="1535" rx="12" fill="#eaf0f7"/><text x="1140" y="185" class="step" text-anchor="middle">状态 / 标签 / 事件</text><rect x="1380" y="145" width="400" height="1535" rx="12" fill="#f3f6fb"/><text x="1580" y="185" class="step" text-anchor="middle">属性 / Vital / 表现</text><rect x="75" y="235" width="370" height="140" rx="12" fill="#e9f8f2" stroke="#8191a8" stroke-width="1.5"/>
<text x="97" y="271" class="step" text-anchor="start">1  输入与激活</text><text x="97" y="305" class="note" text-anchor="start">宿主提交目标 / 位置</text><text x="97" y="334" class="note" text-anchor="start">Feature 检查；树开始运行</text><rect x="515" y="235" width="370" height="140" rx="12" fill="#fff3df" stroke="#8191a8" stroke-width="1.5"/>
<text x="537" y="271" class="step" text-anchor="start">2  行为树提交操作</text><text x="537" y="305" class="note" text-anchor="start">冷却 / 消耗 / 查询 / 效果</text><text x="537" y="334" class="note" text-anchor="start">顺序由具体 execution_tree 定义</text><rect x="955" y="455" width="370" height="140" rx="12" fill="#eaf3ff" stroke="#8191a8" stroke-width="1.5"/>
<text x="977" y="491" class="step" text-anchor="start">3  配置持续增益</text><text x="977" y="525" class="note" text-anchor="start">GE_ApplyStatus → 状态实例</text><text x="977" y="554" class="note" text-anchor="start">进入效果 / 策略 / 标签</text><rect x="1395" y="455" width="370" height="140" rx="12" fill="#e9f8f2" stroke="#8191a8" stroke-width="1.5"/>
<text x="1417" y="491" class="step" text-anchor="start">4  进入效果改变属性</text><text x="1417" y="525" class="note" text-anchor="start">防御修改器 +10，原值 5 → 15</text><text x="1417" y="554" class="note" text-anchor="start">按 source_id 记录；重算发信号</text><rect x="75" y="675" width="370" height="140" rx="12" fill="#e9f8f2" stroke="#8191a8" stroke-width="1.5"/>
<text x="97" y="711" class="step" text-anchor="start">5  后续攻击或命中</text><text x="97" y="745" class="note" text-anchor="start">技能直接应用伤害效果</text><text x="97" y="774" class="note" text-anchor="start">或投射物 payload → 状态效果</text><rect x="515" y="675" width="370" height="140" rx="12" fill="#fff3df" stroke="#8191a8" stroke-width="1.5"/>
<text x="537" y="711" class="step" text-anchor="start">6  统一 Effect 准入</text><text x="537" y="745" class="note" text-anchor="start">过滤器与标签检查通过</text><text x="537" y="774" class="note" text-anchor="start">读取属性；候选伤害 30−15=15</text><rect x="1395" y="895" width="370" height="140" rx="12" fill="#e9f8f2" stroke="#8191a8" stroke-width="1.5"/>
<text x="1417" y="931" class="step" text-anchor="start">7  HealthVital 受伤事件</text><text x="1417" y="965" class="note" text-anchor="start">DamageInfo.final_damage = 15</text><text x="1417" y="994" class="note" text-anchor="start">同步 damage_received 广播</text><rect x="955" y="895" width="370" height="140" rx="12" fill="#eaf3ff" stroke="#8191a8" stroke-width="1.5"/>
<text x="977" y="931" class="step" text-anchor="start">8  可选事件减伤状态</text><text x="977" y="965" class="note" text-anchor="start">FeatureEventListener 匹配事件</text><text x="977" y="994" class="note" text-anchor="start">修改同一伤害对象：15×0.5=7.5</text><rect x="1395" y="1115" width="370" height="140" rx="12" fill="#e9f8f2" stroke="#8191a8" stroke-width="1.5"/>
<text x="1417" y="1151" class="step" text-anchor="start">9  结算与表现</text><text x="1417" y="1185" class="note" text-anchor="start">读取变更后伤害：100 → 92.5</text><text x="1417" y="1214" class="note" text-anchor="start">damage_applied；Effect 再播放 Cue</text><rect x="955" y="1335" width="370" height="140" rx="12" fill="#e9f8f2" stroke="#8191a8" stroke-width="1.5"/>
<text x="977" y="1371" class="step" text-anchor="start">10  周期或持续时间到期</text><text x="977" y="1405" class="note" text-anchor="start">周期 Feature 重新调用 Effect</text><text x="977" y="1434" class="note" text-anchor="start">到期则 remove_status()</text><rect x="1395" y="1335" width="370" height="140" rx="12" fill="#e9f8f2" stroke="#8191a8" stroke-width="1.5"/>
<text x="1417" y="1371" class="step" text-anchor="start">11  清理与数值联动</text><text x="1417" y="1405" class="note" text-anchor="start">移除来源修改器：防御 15 → 5</text><text x="1417" y="1434" class="note" text-anchor="start">属性信号刷新 Vital 上限；停 Cue</text><path d="M445 305H515" class="edge " marker-end="url(#arrow)"/><path d="M700 375V415H1140V455" class="edge dependency" marker-end="url(#arrow)"/><text x="780" y="403" class="label" text-anchor="start">施加状态分支</text><path d="M1325 525H1395" class="edge " marker-end="url(#arrow)"/><path d="M445 745H515" class="edge " marker-end="url(#arrow)"/><path d="M700 815V855H1580V895" class="edge dependency" marker-end="url(#arrow)"/><text x="805" y="843" class="label" text-anchor="start">计算后提交</text><path d="M1395 965H1325" class="edge dependency" marker-end="url(#arrow)"/><path d="M1140 1035V1075H1580V1115" class="edge dependency" marker-end="url(#arrow)"/><text x="1150" y="1063" class="label" text-anchor="start">回读 final_damage</text><path d="M1325 1405H1395" class="edge " marker-end="url(#arrow)"/><path d="M955 1405H910V775H885" class="edge dependency" marker-end="url(#arrow)"/><text x="610" y="1378" class="label" text-anchor="start">周期：重新进入 Effect</text><text x="80" y="1570" class="note" text-anchor="start">数值例子为可配置场景，非当前燃烧示例的默认效果；四条泳道按时间向下阅读。</text><text x="80" y="1608" class="note" text-anchor="start">事件状态分支需要匹配实体作用域；当前全局总线未隔离目标，多个实体监听时可能串扰。</text><text x="80" y="1646" class="note" text-anchor="start">图中“提交操作”概括共同阶段；主动模板的实际冷却、消耗、查询顺序见 README。</text>
</svg>
