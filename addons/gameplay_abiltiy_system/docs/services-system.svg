<text x="72" y="1366" class="step" text-anchor="start">实现要点</text><text x="72" y="1400" class="note" text-anchor="start">GAS 注册四个 Autoload；事件直接使用 CoreSystem.event_bus。GameplayAbilitySystem 只负责组件查询。</text><text x="72" y="1429" class="note" text-anchor="start">标签存于目标 Node 的 meta 引用计数及 tag_* 分组；查询默认包含父标签，不自动给父标签增加计数。</text><text x="72" y="1458" class="note" text-anchor="start">事件总线同步 emit，不排队、不复制字典、不划分实体作用域；伤害事件传递同一个 DamageInfo 引用。</text>
