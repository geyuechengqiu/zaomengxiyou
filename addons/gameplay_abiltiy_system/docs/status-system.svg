<text x="72" y="2126" class="step" text-anchor="start">实现要点</text><text x="72" y="2160" class="note" text-anchor="start">状态实例持有独立定义图、持续时间策略副本和 Feature 私有存储；效果执行时逐个深复制。</text><text x="72" y="2189" class="note" text-anchor="start">优先级：高替换、低拒绝、相等交给堆叠策略。叠层仅重施可撤销的持续效果，不重放瞬时伤害/治疗。</text><text x="72" y="2218" class="note" text-anchor="start">到期先移出活跃表，再执行移除效果、清理修改器 / Feature / 标签 / 状态 Cue。</text>
