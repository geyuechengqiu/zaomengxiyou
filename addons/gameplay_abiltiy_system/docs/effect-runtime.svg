<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440" role="img" aria-labelledby="title description">
<title id="title">效果运行流程</title><desc id="description">调用顺序与实际实现一致；细节及当前限制见 README · 虚线表示条件退出或跨系统调用</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#52637a" stroke-width="1.4"/></marker>
  <marker id="inherit" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L16 8L0 16Z" fill="white" stroke="#52637a" stroke-width="1.4"/></marker>
  <marker id="owned" viewBox="-9 -7 18 14" refX="0" refY="0" markerWidth="13" markerHeight="11" orient="auto"><path d="M-8 0L0 -6L8 0L0 6Z" fill="#52637a" stroke="#52637a"/></marker>
  <marker id="shared" viewBox="-9 -7 18 14" refX="0" refY="0" markerWidth="13" markerHeight="11" orient="auto"><path d="M-8 0L0 -6L8 0L0 6Z" fill="white" stroke="#52637a"/></marker>
</defs>
<style>
  text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#243449}
  .title{font-size:34px;font-weight:700}.subtitle{font-size:20px;fill:#53657c}
  .name{font-family:Consolas,'Microsoft YaHei',monospace;font-size:22px;font-weight:700}
  .type{font-size:16px;fill:#596c84}.body{font-family:Consolas,'Microsoft YaHei',monospace;font-size:18px}
  .label{font-size:17px;paint-order:stroke;stroke:#fbfcff;stroke-width:6px;stroke-linejoin:round}
  .note{font-size:19px;fill:#52637a}.step{font-size:22px;font-weight:700}
  .edge{fill:none;stroke:#52637a;stroke-width:2}.dependency{stroke-dasharray:8 6}
</style>
<rect width="1800" height="1440" fill="#fbfcff"/>
<text x="50" y="60" class="title" text-anchor="start">效果运行流程</text><text x="50" y="98" class="subtitle" text-anchor="start">调用顺序与实际实现一致；细节及当前限制见 README · 虚线表示条件退出或跨系统调用</text>
<text x="50" y="148" class="note" text-anchor="start">左：一次效果调用　　右：持续状态与周期触发</text><rect x="80" y="200" width="730" height="130" rx="12" fill="#e9f8f2" stroke="#8191a8" stroke-width="1.5"/>
<text x="102" y="236" class="step" text-anchor="start">1  技能激活 / 周期 / 命中触发</text><text x="102" y="270" class="note" text-anchor="start">AbilityNodeApplyEffect / GameplayStatusInstance</text><text x="102" y="299" class="note" text-anchor="start">duplicate(true) → effect.apply(target, instigator, context)</text><rect x="80" y="390" width="730" height="160" rx="12" fill="#fff3df" stroke="#8191a8" stroke-width="1.5"/>
<text x="102" y="426" class="step" text-anchor="start">2  GameplayEffect._check_filters()</text><text x="102" y="460" class="note" text-anchor="start">逐个 filter.check()；阻止标签任意命中则拒绝</text><text x="102" y="489" class="note" text-anchor="start">必需标签必须全部满足；任一步失败直接 return</text><rect x="80" y="610" width="730" height="160" rx="12" fill="#fff3df" stroke="#8191a8" stroke-width="1.5"/>
<text x="102" y="646" class="step" text-anchor="start">3  子类 _apply()</text><text x="102" y="680" class="note" text-anchor="start">伤害：策略计算 → DamageInfo → HealthVital.apply_damage</text><text x="102" y="709" class="note" text-anchor="start">治疗 / 属性 / 状态 / 魔法场 / 位移等操作</text><rect x="80" y="830" width="730" height="130" rx="12" fill="#eaf3ff" stroke="#8191a8" stroke-width="1.5"/>
<text x="102" y="866" class="step" text-anchor="start">4  执行可选 Cue</text><text x="102" y="900" class="note" text-anchor="start">GameplayCueManager.execute_cue(cue, target, context)</text><text x="102" y="929" class="note" text-anchor="start">读取逻辑写入的 final_damage 等数据</text><rect x="80" y="1020" width="730" height="130" rx="12" fill="#fff3df" stroke="#8191a8" stroke-width="1.5"/>
<text x="102" y="1056" class="step" text-anchor="start">5  子效果逐个递归执行</text><text x="102" y="1090" class="note" text-anchor="start">子效果也 duplicate(true)，再进入自己的 apply()</text><text x="102" y="1119" class="note" text-anchor="start">子效果与父效果共享当前 context</text><rect x="980" y="200" width="740" height="160" rx="12" fill="#fff3df" stroke="#8191a8" stroke-width="1.5"/>
<text x="1002" y="236" class="step" text-anchor="start">A  GE_ApplyStatus / 直接 apply_status()</text><text x="1002" y="270" class="note" text-anchor="start">优先级检查 → 堆叠策略 → 创建状态实例</text><text x="1002" y="299" class="note" text-anchor="start">按分组裁决；叠层/刷新返回保留的实例</text><rect x="980" y="430" width="740" height="160" rx="12" fill="#e9f8f2" stroke="#8191a8" stroke-width="1.5"/>
<text x="1002" y="466" class="step" text-anchor="start">B  GameplayStatusInstance.apply()</text><text x="1002" y="500" class="note" text-anchor="start">克隆定义；独立缓存和 effect_state；实例 source_id</text><text x="1002" y="529" class="note" text-anchor="start">先初始化时长与标签，再进入效果/Feature/Cue</text><rect x="980" y="660" width="740" height="190" rx="12" fill="#e9f8f2" stroke="#8191a8" stroke-width="1.5"/>
<text x="1002" y="696" class="step" text-anchor="start">C  GameplayStatusComponent._process(delta)</text><text x="1002" y="730" class="note" text-anchor="start">先补算截止到期的全部周期，再执行到期移除</text><text x="1002" y="759" class="note" text-anchor="start">事件采用快照和移除守卫，不污染初始上下文</text><text x="1002" y="788" class="note" text-anchor="start">周期或事件效果仍进入左侧的完整 apply() 流程</text><rect x="980" y="950" width="740" height="200" rx="12" fill="#e9f8f2" stroke="#8191a8" stroke-width="1.5"/>
<text x="1002" y="986" class="step" text-anchor="start">D  remove_status() → instance.remove()</text><text x="1002" y="1020" class="note" text-anchor="start">应用 remove_effects，再 remove 原 apply_effects</text><text x="1002" y="1049" class="note" text-anchor="start">移除 Feature 存储、状态标签，停止状态 Cue</text><text x="1002" y="1078" class="note" text-anchor="start">发出 status_completed / status_removed 信号</text><path d="M445 330V390" class="edge " marker-end="url(#arrow)"/><path d="M445 550V610" class="edge " marker-end="url(#arrow)"/><path d="M445 770V830" class="edge " marker-end="url(#arrow)"/><path d="M445 960V1020" class="edge " marker-end="url(#arrow)"/><path d="M1350 360V430" class="edge " marker-end="url(#arrow)"/><path d="M1350 590V660" class="edge " marker-end="url(#arrow)"/><path d="M1350 850V950" class="edge " marker-end="url(#arrow)"/><circle cx="865" cy="443" r="19" fill="#fde8e8" stroke="#bc6972"/><text x="865" y="451" class="step" text-anchor="middle">×</text><path d="M810 470H865V462" class="edge dependency" marker-end="url(#arrow)"/><text x="841" y="408" class="label" text-anchor="start">拒绝</text><path d="M980 745H930V265H810" class="edge dependency" marker-end="url(#arrow)"/><text x="842" y="635" class="label" text-anchor="start">触发效果</text><rect x="80" y="1220" width="1640" height="170" rx="12" fill="#f0f4fa"/>
<text x="105" y="1260" class="step" text-anchor="start">顺序与生命周期要点</text>
<text x="105" y="1298" class="note" text-anchor="start">apply() 不返回执行结果；子类提前 return 后，基类仍可能继续播放 Cue 和执行子效果。</text>
<text x="105" y="1333" class="note" text-anchor="start">remove() 默认不撤销伤害或治疗，也不自动停止效果 Cue；状态 Cue 由状态实例单独清理。</text>
<text x="105" y="1368" class="note" text-anchor="start">duration=0 仅瞬时；叠层只重放持续效果；实例身份清理不误删新状态。</text>
</svg>
