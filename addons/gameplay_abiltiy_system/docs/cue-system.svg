<text x="72" y="1366" class="step" text-anchor="start">实现要点</text><text x="72" y="1400" class="note" text-anchor="start">逻辑和值变化来自 Effect；Cue 只创建 / 更新视觉节点，不计算伤害或状态持续时间。</text><text x="72" y="1429" class="note" text-anchor="start">挂点接口必须返回 Node3D；管理器无坐标回退。状态 Cue 使用空 context，效果 Cue 使用执行 context。</text><text x="72" y="1458" class="note" text-anchor="start">所有 Cue 组件都会加入持续列表；效果 remove 不会自动 stop Cue，长期运行需关注生命周期。</text>
