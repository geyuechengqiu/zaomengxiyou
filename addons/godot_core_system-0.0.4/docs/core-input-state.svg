    </g></a><rect x="50" y="2290" width="1700" height="143" rx="12" fill="#f0edff" stroke="#91a6c1"/><text x="75" y="2328" class="note">InputManager 轮询与 OperationController 语义意图是并列通道，没有自动连接。</text><text x="75" y="2359" class="note">控制器由角色挂树；状态机由管理器或角色驱动，须避免重复 update。</text><text x="75" y="2390" class="note">输入 Handler、配置适配器与层级切换的现有限制见实现分析。</text></svg>